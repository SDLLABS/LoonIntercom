 slow two-wire chip bus) on the doorbell computer.","caution":"It is a 3.3 V module. Feed it from the doorbell computer's 3.3 V, never from the 5 V distribution."},"de":{"what":"Die 6-polige Stiftleiste (Reihe von Pins) auf die Sensorplatine löten. Die Drähte gehen an 3,3 V, Masse, SDA und SCL (die beiden I2C-Leitungen, ein langsamer Zweidraht-Bus) am Klingelrechner.","caution":"Es ist ein 3,3-V-Modul. Die Versorgung kommt von den 3,3 V des Klingelrechners, nie von der 5-V-Verteilung."}},"mosfet":{"en":{"what":"Solder the blue 3-pin and the green 2-pin screw terminals (clamps that hold a bare wire under a screw) and the 3-pin signal header (pin row for the control wires) onto the heater switch module.","caution":"Find the switched output terminal with a meter first. With the pad connected and the signal off, the pad must stay cold."},"de":{"what":"Die blaue 3-polige und die grüne 2-polige Schraubklemme (halten einen blanken Draht unter einer Schraube) sowie die 3-polige Signal-Stiftleiste (Pinreihe für die Steuerdrähte) auf das Heizungs-Schaltmodul löten.","caution":"Erst mit dem Messgerät die geschaltete Ausgangsklemme finden. Mit angeschlossenem Pad und ohne Signal muss das Pad kalt bleiben."}},"pololu":{"en":{"what":"Solder header pins (a pin row) or wires onto VIN (12 V in), GND (ground) and VOUT (5 V out). Needed only with a 12 V PoE splitter (it splits the cable into data and power), which is not decided yet.","caution":"Mark input and output clearly: swapped, 12 V would reach every part on the 5 V side. Measure 5 V at VOUT before connecting anything."},"de":{"what":"Stiftleiste (Pinreihe) oder Drähte an VIN (Eingang 12 V), GND (Masse) und VOUT (Ausgang 5 V) löten. Nötig nur mit einem 12-V-PoE-Splitter (trennt das Kabel in Daten und Strom); das ist noch nicht entschieden.","caution":"Ein- und Ausgang deutlich beschriften. Vertauscht bekämen alle 5-V-Teile 12 V. Vor dem Anschließen an VOUT 5 V nachmessen."}},"fuse":{"en":{"what":"Put the 73 °C thermal fuse (a one-time cut-out for overheating) in series with the heater pad. Crimping (a squeezed metal sleeve, no heat) is preferred. If soldering: long legs, pliers between joint and fuse body.","caution":"Soldering heat can blow a 73 °C fuse for good; the pliers act as a heat sink (they draw the heat away). Check with a meter that it still conducts."},"de":{"what":"Die 73-°C-Thermosicherung (trennt einmalig bei Überhitzung) in Reihe mit dem Heizpad. Am besten crimpen (Metallhülse aufquetschen, ohne Hitze). Beim Löten: Beine lang lassen, Zange zwischen Lötstelle und Sicherung.","caution":"Lötwärme kann eine 73-°C-Sicherung dauerhaft auslösen, die Zange leitet die Wärme ab. Danach mit dem Messgerät prüfen, ob sie noch Durchgang hat."}},"waveshare":{"en":{"what":"Board for the talk computer not chosen yet.","caution":""},"de":{"what":"Platine des Sprechrechners noch nicht gewählt.","caution":""}},"wt32":{"en":{"what":"Solder the pin header row IO43 ... VBUS (the kit comes with loose headers). The button line uses 3V3, IO1 and GND.","caution":"Check for solder bridges between neighbours before power-up, above all between 3V3, 3V3_EN and GND."},"de":{"what":"Die Stiftleiste IO43 … VBUS einlöten (liegt lose bei). Die Klingelleitung nutzt 3V3, IO1 und GND.","caution":"Vor dem Einschalten auf Lötbrücken zwischen Nachbarpins prüfen, vor allem zwischen 3V3, 3V3_EN und GND."}}},"zones":{"internet":{"en":{"name":"Internet","plain":"Outside services on the internet: only Telegram, a messenger that is planned to carry visitor voice messages to your phone."},"de":{"name":"Internet","plain":"Dienste im Internet: nur Telegram, ein Messenger, über den Sprachnachrichten von Besuchern auf dein Handy kommen sollen (geplant)."}},"house":{"en":{"name":"House","plain":"Inside the house: the Home Assistant server (runs the home automations), the WiFi access point, a local speech-to-text server and your phone, plus planned house speakers and a planned family app."},"de":{"name":"Haus","plain":"Im Haus: der Home-Assistant-Server (steuert die Hausautomation), der WLAN-Access-Point, ein lokaler Server für Spracherkennung und dein Handy, dazu geplante Hauslautsprecher und eine geplante Familien-App."}},"technikraum":{"en":{"name":"Technical room","plain":"Indoor room that feeds the door: UPS (battery-backed mains supply), PoE switch (sends power and data down one network cable), surge protector and house earth; the door needs no power supply of its own here."},"de":{"name":"Technikraum","plain":"Der Raum im Haus, der die Tür versorgt: USV (Stromversorgung mit Akku), PoE-Switch (schickt Strom und Daten über ein Netzwerkkabel), Überspannungsschutz und Hauserde; die Tür braucht hier kein eigenes Netzteil."}},"wall":{"en":{"name":"Outside wall","plain":"14 cm of facade insulation in front of masonry; one outdoor network cable crosses it into the box through a split cable gland (a sealed cable entry), and its exact route is still open."},"de":{"name":"Außenwand","plain":"14 cm Fassadendämmung vor dem Mauerwerk; ein Outdoor-Netzwerkkabel führt hindurch und über eine geteilte Kabelverschraubung (dichte Kabeldurchführung) in den Kasten, der genaue Kabelweg ist noch offen."}},"box":{"en":{"name":"Wall box","plain":"Sealed 3D-printed box, flush in the insulation behind the brass front, holding the PoE splitter (separates power from data), power distribution, the three door computers and small parts; heated in winter."},"de":{"name":"Einbaukasten","plain":"Dichter, 3D-gedruckter Kasten, bündig in der Dämmung hinter der Messingfront: PoE-Splitter (trennt Strom und Daten), Stromverteilung, die drei Türrechner und die Kleinteile; im Winter beheizt."}},"front":{"en":{"name":"Brass front","plain":"The visible brass front with all parts in or right behind it: light and diffuser (spreads the light) under the folded roof, speaker, screen, mic holes and push button; there is no camera."},"de":{"name":"Messingfront","plain":"Die sichtbare Messingfront mit allem, was darin oder direkt dahinter sitzt: Licht mit Diffusor (streut das Licht) unter dem gekanteten Dach, Lautsprecher, Bildschirm, Mikrofonlöcher, Taster; keine Kamera."}}},"layers":{"mains":{"en":{"name":"Mains 230 V","plain":"Household mains power at 230 V, only indoors: it feeds the UPS (a battery-backed power supply), and the UPS feeds the network switch."},"de":{"name":"Netz 230 V","plain":"Netzspannung 230 V aus der Hausinstallation, nur im Haus: Sie versorgt die USV (Stromversorgung mit Akku), und die USV versorgt den Netzwerk-Switch."}},"poe":{"en":{"name":"PoE (48 V)","plain":"Power over Ethernet: one network cable carries data and about 48 V power from the switch to the box; the high voltage keeps the current, and with it the loss in the cable, small."},"de":{"name":"PoE (48 V)","plain":"Power over Ethernet: Ein Netzwerkkabel bringt Daten und Strom mit etwa 48 V vom Switch zum Kasten; die hohe Spannung hält den Strom und damit den Verlust im Kabel klein."}},"ethernet":{"en":{"name":"Ethernet data","plain":"Wired network data only, with no power on the line."},"de":{"name":"Ethernet-Daten","plain":"Nur Netzwerkdaten über Kabel, ohne Stromversorgung."}},"wifi":{"en":{"name":"WiFi","plain":"Radio network; the screen computer and the talk computer use it. The doorbell computer stays on the cable."},"de":{"name":"WLAN","plain":"Funknetz; Bildschirm- und Sprechrechner nutzen es. Der Klingelrechner bleibt am Kabel."}},"v12":{"en":{"name":"12 V supply","plain":"12 V made by the PoE splitter (separates power from data) in the box for the heater and the 5 V converter; not decided yet, because a splitter with a 5 V output is the alternative."},"de":{"name":"12-V-Versorgung","plain":"12 V aus dem PoE-Splitter (trennt Strom und Daten) im Kasten für die Heizung und den 5-V-Wandler; noch nicht entschieden, die Alternative ist ein Splitter mit 5 V Ausgang."}},"v5":{"en":{"name":"5 V supply","plain":"5 V made from 12 V by one step-down converter (turns a higher voltage into a lower one); it feeds all three computers, the amplifier, the LED strip and the level shifter (raises the LED signal to 5 V)."},"de":{"name":"5-V-Versorgung","plain":"5 V, von einem Abwärtswandler (macht aus höherer Spannung eine niedrigere) aus 12 V erzeugt; versorgt alle drei Rechner, Verstärker, LED-Streifen und Pegelwandler (hebt das LED-Signal auf 5 V)."}},"v3":{"en":{"name":"3.3 V supply","plain":"3.3 V made on the doorbell and talk computer boards from their 5 V; it feeds the BME280 climate sensor and the pull-up (a resistor that holds a line at a known voltage) on the button line, and the microphone."},"de":{"name":"3,3-V-Versorgung","plain":"3,3 V, auf den Platinen von Klingel- und Sprechrechner aus deren 5 V erzeugt; versorgt den Klimasensor BME280 und den Pull-up (Widerstand, der eine Leitung auf fester Spannung hält) der Klingelleitung sowie das Mikrofon."}},"gnd":{"en":{"name":"Ground (0 V)","plain":"The shared return path: every part sends its current back through it and every signal is measured against it, so all grounds in the box join at one point."},"de":{"name":"Masse (0 V)","plain":"Der gemeinsame Rückweg: Jeder Strom fließt über sie zurück und jedes Signal wird gegen sie gemessen, deshalb treffen sich alle Masseleitungen des Kastens in einem Punkt."}},"earth":{"en":{"name":"Protective earth","plain":"The house protective earth; of the doorbell parts, only the surge protector (diverts voltage spikes from lightning) is connected to it, by an electrician. It carries no current in normal operation."},"de":{"name":"Schutzerde","plain":"Die Schutzerde des Hauses; von der Klingel hängt nur der Überspannungsschutz (leitet Spannungsspitzen durch Blitz ab) daran, angeschlossen vom Elektriker. Im Normalbetrieb fließt darüber kein Strom."}},"i2c":{"en":{"name":"I2C sensor bus","plain":"I2C: a slow two-wire bus (shared wires that chips use to talk), SDA for data and SCL for the clock; it connects the BME280 climate sensor to the doorbell computer."},"de":{"name":"I2C-Sensorbus","plain":"I2C: ein langsamer Bus aus zwei Leitungen (über die Chips miteinander reden), SDA für Daten und SCL für den Takt; er verbindet den Klimasensor BME280 mit dem Klingelrechner."}},"i2s":{"en":{"name":"I2S audio bus","plain":"I2S: a three-wire digital audio bus (bit clock, word clock, data) between the talk computer and both the microphone and the amplifier; being digital it resists noise, yet the wires must stay short."},"de":{"name":"I2S-Audiobus","plain":"I2S: ein digitaler Audiobus mit drei Leitungen (Bittakt, Worttakt, Daten) zwischen Sprechrechner, Mikrofon und Verstärker; digital und daher störfest, die Leitungen müssen trotzdem kurz bleiben."}},"gpio":{"en":{"name":"Control lines","plain":"Single lines from one computer pin each (GPIO, a general-purpose pin): the LED data line through the level shifter (raises 3.3 V to 5 V) and the heater on/off signal."},"de":{"name":"Steuerleitungen","plain":"Einzelne Leitungen von je einem Rechner-Pin (GPIO, frei nutzbarer Ein-/Ausgang): die LED-Datenleitung über den Pegelwandler (hebt 3,3 V auf 5 V) und das Ein/Aus-Signal der Heizung."}},"button":{"en":{"name":"Doorbell line","plain":"Monitored button line: resistors create three voltages (idle about 1.73 V, pressed about 0.30 V, wire cut about 3.1 to 3.3 V) that the computer measures on an analog pin, so a cut wire is reported."},"de":{"name":"Klingelleitung","plain":"Überwachte Klingelleitung: Widerstände erzeugen drei Spannungen (Ruhe etwa 1,73 V, gedrückt etwa 0,30 V, Drahtbruch etwa 3,1 bis 3,3 V), die der Rechner analog misst; ein Drahtbruch wird gemeldet."}},"speaker":{"en":{"name":"Speaker wires","plain":"The two amplified wires from the amplifier screw terminal to the loudspeaker; both carry the signal and neither is ground (the 0 V return)."},"de":{"name":"Lautsprecherkabel","plain":"Die zwei verstärkten Leitungen von der Schraubklemme des Verstärkers zum Lautsprecher; beide führen Signal, keine davon ist Masse (der 0-V-Rückleiter)."}},"software":{"en":{"name":"Software links","plain":"Logical links over the network: the ESPHome connection (firmware on the door computers) to Home Assistant, phone notifications, screen content, and the planned voice-message and push-to-talk paths."},"de":{"name":"Datenflüsse","plain":"Logische Verbindungen über das Netz: die ESPHome-Verbindung (Firmware der Türrechner) zu Home Assistant, Handy-Benachrichtigungen, Bildschirminhalte sowie die geplanten Wege für Sprachnachrichten und Push-to-Talk."}},"mech":{"en":{"name":"Mechanics & seals","plain":"How parts are mounted and sealed, and where air, water, light and sound may pass."},"de":{"name":"Mechanik & Dichtung","plain":"Wie die Teile befestigt und abgedichtet sind und wo Luft, Wasser, Licht und Schall durchgelassen werden."}}},"pending":[{"en":"Talk computer board and power path (splitter, or the doorbell computer's PoE module powering the box): re-decided after the WT32-ETH01 was dropped on 30 Sep 2026.","de":"Platine des Sprechrechners und Stromweg (Splitter, oder das PoE-Modul des Klingelrechners versorgt den Kasten): werden neu entschieden, seit der WT32-ETH01 am 30.09.2026 ausgeschieden ist."},{"en":"Two-way talk: chosen (VoIP Stack on the talk computer, walkie-talkie mode as fallback) but not yet proven on the bench. Push-to-talk into the house speakers and Telegram voice messages are not designed yet.","de":"Gegensprechen: gewählt (VoIP Stack auf dem Sprechrechner, Wechselsprechen als Rückfallebene), aber am Labortisch noch nicht erprobt. Push-to-Talk auf die Hauslautsprecher und Sprachnachrichten per Telegram sind noch nicht entworfen."},{"en":"Splitter output, 12 V or 5 V, is not decided yet; the heater voltage follows from it.","de":"Ausgangsspannung des Splitters, 12 V oder 5 V, ist noch nicht entschieden; davon hängt die Heizspannung ab."},{"en":"PoE power budget: ring plus call plus heater comes close to the 802.3af limit (about 12 of 12.95 W). The doorbell computer switches the heater off during calls; the real draw is not measured yet.","de":"PoE-Strombudget: Klingeln plus Gespräch plus Heizung kommt nahe an die Grenze von 802.3af (etwa 12 von 12,95 W). Der Klingelrechner schaltet die Heizung während eines Gesprächs ab; der echte Verbrauch ist noch nicht gemessen."},{"en":"Pin assignment on the talk computer (board being re-decided). The doorbell button is on IO1 (tested on the bench).","de":"Pinbelegung am Sprechrechner (Platine wird neu entschieden). Der Klingeltaster liegt an IO1 (auf dem Tisch getestet)."},{"en":"WiFi signal for the screen and the talk computer inside the box, behind the brass: still to be tested on site.","de":"WLAN-Empfang von Bildschirm und Sprechrechner im Kasten hinter dem Messing: Test vor Ort steht noch aus."},{"en":"LED strip type (probably RGBW, with a separate white LED): still to be checked on the bench.","de":"Typ des LED-Streifens (vermutlich RGBW, mit eigener weißer LED): Prüfung auf dem Labortisch steht noch aus."},{"en":"CAD: the measured screen glass needs a smaller brass window (visible area 56.95 × 101.9 mm) and about 1.5 mm more room below the speaker block.","de":"CAD: Das gemessene Bildschirmglas braucht ein kleineres Messingfenster (sichtbare Fläche 56,95 × 101,9 mm) und etwa 1,5 mm mehr Platz unter dem Lautsprechermodul."},{"en":"CAD: the floor of the cavity behind the grille slopes the wrong way, so water would pool at the speaker; the fix is pending.","de":"CAD: Der Boden des Hohlraums hinter dem Gitter fällt zur falschen Seite, Wasser würde sich am Lautsprecher sammeln; die Korrektur steht noch aus."}],"milestones":{"m_concept":{"en":{"title":"Concept and architecture","why":"Decide what the device is before buying and printing: the front design, the parts and how they connect.","done_when":"Every part, wire and open decision is on the map.","tasks":{"t_front":"Front design v5: one bent brass sheet, 100 × 260 mm, light band under the roof","t_arch":"Architecture: one PoE cable, three computers (doorbell, talk, screen)","t_parts":"Parts chosen and drawn with their dimensions","t_map":"This map and the public repository"}},"de":{"title":"Konzept und Architektur","why":"Festlegen, was das Gerät ist, bevor gekauft und gedruckt wird: Frontdesign, Teile und wie sie zusammenhängen.","done_when":"Jedes Teil, jede Leitung und jede offene Entscheidung steht auf der Karte.","tasks":{"t_front":"Frontdesign v5: ein gekantetes Messingblech, 100 × 260 mm, Lichtband unter dem Dach","t_arch":"Architektur: ein PoE-Kabel, drei Rechner (Klingel, Sprechen, Bildschirm)","t_parts":"Teile ausgewählt und mit ihren Maßen gezeichnet","t_map":"Diese Karte und das öffentliche Repository"}}},"m_parts":{"en":{"title":"All hardware on the table","why":"Nothing can be measured, fitted or programmed for real until every part of the final build is here.","done_when":"Every part of the final build is here and identified.","tasks":{"t_split":"Lock in: splitter 12 V or 5 V (it decides the heater and its switch)","t_order":"Place the order: cable, cable gland, heater, seals, small parts","t_inhand":"In hand: doorbell and talk computers, microphones, amplifier, speaker, 12→5 V converter, level shifter, climate sensor, heater switch, USB-serial adapter, thermal fuses","t_mail":"Everything ordered so far has arrived (the screen computer last, 29 Sep)","t_bench":"Bench checks on arrival: touch chip ✓ (GT911, 29 Sep), LED strip really RGBW, heater switch triggers at 3.3 V"}},"de":{"title":"Alle Hardware auf dem Tisch","why":"Solange nicht jedes Teil des fertigen Geräts da ist, lässt sich nichts wirklich messen, einpassen oder programmieren.","done_when":"Jedes Teil des fertigen Geräts ist da und bestimmt.","tasks":{"t_split":"Festlegen: Splitter 12 V oder 5 V (davon hängen Heizung und Schalter ab)","t_order":"Bestellen: Kabel, Kabeleinführung, Heizung, Dichtungen, Kleinteile","t_inhand":"Da: Klingel- und Sprechrechner, Mikrofone, Verstärker, Lautsprecher, 12→5-V-Wandler, Pegelwandler, Klimasensor, Heizungsschalter, USB-Seriell-Adapter, T  herum)","t_test":"Wassertest eines abgedichteten Testkastens: Schlauch oder Dusche, danach innen trocken"}}},"m_beta":{"en":{"title":"Beta box on the desk","why":"The complete device in its real box, with the steel bracket and a dummy plate, running on the desk over Ethernet. Not watertight yet.","done_when":"The whole device runs in its box for two weeks without a surprise.","tasks":{"t_bprint":"Print the beta box from what the alpha prints showed","t_bbracket":"Fit the steel bracket and a dummy plate (flat, same cut-outs)","t_bwire":"All inside wiring finished; the wiring to the outside is settled","t_bsoak":"Two weeks on the desk over Ethernet: scripted rings and calls, 20 PoE power cycles, no unexpected reboot of the doorbell computer"}},"de":{"title":"Beta-Kasten auf dem Tisch","why":"Das komplette Gerät in seinem echten Kasten, mit Stahlrahmen und Dummy-Platte, am Tisch per Ethernet in Betrieb. Noch nicht wasserdicht.","done_when":"Das ganze Gerät läuft zwei Wochen in seinem Kasten ohne Überraschung.","tasks":{"t_bprint":"Beta-Kasten nach den Erkenntnissen der Alpha-Drucke drucken","t_bbracket":"Stahlrahmen und Dummy-Platte (flach, gleiche Ausschnitte) einbauen","t_bwire":"Verkabelung innen fertig; der Anschluss nach außen steht fest","t_bsoak":"Zwei Wochen am Tisch per Ethernet: automatische Klingel- und Gesprächstests, 20 PoE-Neustarts, kein unerwarteter Neustart des Klingelrechners"}}},"m_pre":{"en":{"title":"Pre-release box","why":"Bring the sealing lessons into the proven beta design and order the real brass front.","done_when":"The finished device passes the water test and the cold start.","tasks":{"t_papply":"Apply the sealing recipe to the beta design","t_pbrass":"Order the real brass front from a metal shop (laser-cut, bent, engraved)","t_pprint":"Final print in the chosen material","t_pwater":"Water test of the complete device","t_pcold":"Freezer cold start: heater, screen and splitter come up in frost"}},"de":{"title":"Vorserien-Kasten","why":"Die function statusGlyph(st,cx,cy,r){
  r=r||4.5;
  switch(st){
    case 'in_hand': return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" class="sg-fill"/>';
    case 'existing': return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*.8)+'" class="sg-exist"/>';
    case 'in_mail': return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" class="sg-ring"/><path d="M'+cx+' '+(cy-r)+'A'+r+' '+r+' 0 0 0 '+cx+' '+(cy+r)+'Z" class="sg-fill"/>';
    case 'to_buy': return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" class="sg-ring"/>';
    case 'pending': return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" class="sg-ring sg-dash"/>';
    case 'planned': return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" class="sg-ring sg-dot"/>';
    case 'printed': return '<rect x="'+(cx-r)+'" y="'+(cy-r)+'" width="'+(2*r)+'" height="'+(2*r)+'" rx="1" class="sg-brass"/>';
  }
  return '';
}

const canvas=$('#canvas');
const VB0=LY.viewBox;
let vb={x:VB0[0],y:VB0[1],w:VB0[2],h:VB0[3]}, anim=null;
function aspect(){ const r=canvas.getBoundingClientRect(); return (r.width||1)/(r.height||1); }
function norm(v){
  const ar=aspect(), cx=v.x+v.w/2, cy=v.y+v.h/2;
  let w=v.w, h=v.h;
  if(w/h>ar) h=w/ar; else w=h*ar;
  const maxW=Math.max(VB0[2]*1.15, VB0[3]*1.15*ar);
  if(w>maxW){ w=maxW; h=w/ar; }
  if(w<200){ w=200; h=w/ar; }
  const ncx=Math.max(VB0[0], Math.min(VB0[0]+VB0[2], cx)), ncy=Math.max(VB0[1], Math.min(VB0[1]+VB0[3], cy));
  return {x:ncx-w/2, y:ncy-h/2, w, h};
}
function applyView(){ svg.setAttribute('viewBox', f(vb.x)+' '+f(vb.y)+' '+f(vb.w)+' '+f(vb.h)); }
function setVB(v){ if(anim){ cancelAnimationFrame(anim); anim=null; } vb=norm(v); applyView(); }
function animateTo(v){
  const to=norm(v);
  if(reduced){ vb=to; applyView(); return; }
  if(anim) cancelAnimationFrame(anim);
  const from=Object.assign({},vb), t0=performance.now(), D=480;
  const ease=u=>1-Math.pow(1-u,3);
  const tick=now=>{
    const u=Math.min(1,(now-t0)/D), k=ease(u);
    vb={x:from.x+(to.x-from.x)*k, y:from.y+(to.y-from.y)*k, w:from.w+(to.w-from.w)*k, h:from.h+(to.h-from.h)*k};
    applyView();
    anim = u<1 ? requestAnimationFrame(tick) : null;
  };
  anim=requestAnimationFrame(tick);
}
function homeView(){
  const ar=aspect();
  if(ar<1.05) return {x:360, y:VB0[1], w:VB0[3]*ar, h:VB0[3]};
  return {x:VB0[0], y:VB0[1], w:VB0[2], h:VB0[3]};
}
function fitIds(ids,pad){
  pad=pad||70;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ids.forEach(id => { const n=N[id]; if(!n) return; x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x+n.w); y1=Math.max(y1,n.y+n.h); });
  if(x0>x1) return;
  // the part of the canvas not covered by the detail panel or the walkthrough bar
  const R=canvas.getBoundingClientRect();
  const right = R.width - (overlayPanel() && $('.grid').classList.contains('has-sel') ? 372 : 0);
  const bottom = R.height - (state.tour && !tourbar.hidden ? tourbar.offsetHeight + 24 : 0);
  const rw=Math.max(120,right), rh=Math.max(120,bottom);
  const maxS = R.width / Math.min(VB0[2], R.width/R.height<1.05 ? 420 : 640);
  const s = Math.min(rw/(x1-x0+2*pad), rh/(y1-y0+2*pad), maxS);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  animateTo({x:cx-(rw/2)/s, y:cy-(rh/2)/s, w:R.width/s, h:R.height/s});
}
function zoomAt(k,cx,cy){
  const r=canvas.getBoundingClientRect();
  const wx = vb.x + ((cx==null ? r.width/2 : cx-r.left)/r.width)*vb.w;
  const wy = vb.y + ((cy==null ? r.height/2 : cy-r.top)/r.height)*vb.h;
  const w=vb.w*k, h=vb.h*k;
  setVB({x:wx-(wx-vb.x)*k, y:wy-(wy-vb.y)*k, w, h});
}
$('#zIn').onclick=()=>zoomAt(1/1.35);
$('#zOut').onclick=()=>zoomAt(1.35);
$('#zFit').onclick=()=>animateTo(homeView());
svg.addEventListener('wheel',ev=>{
  if(!(ev.ctrlKey||ev.metaKey)) return;
  ev.preventDefault();
  zoomAt(Math.exp(ev.deltaY*0.0022), ev.clientX, ev.clientY);
},{passive:false});
const ptrs=new Map(); let drag=null, pinch=null;
function pinchState(){
  const [a,b]=[...ptrs.values()];
  return {d:Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, vb:Object.assign({},vb)};
}
svg.addEventListener('pointerdown',ev=>{
  if(ev.pointerType==='mouse' && ev.button!==0) return;
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
  if(ptrs.size===1){ drag={x:ev.clientX,y:ev.clientY,vb:Object.assign({},vb),moved:0,target:ev.target.closest('[data-id],[data-edge],[data-badge]')}; pinch=null; }
  else if(ptrs.size===2){ drag=null; pinch=pinchState(); }
});
svg.addEventListener('pointermove',ev=>{
  if(!ptrs.has(ev.pointerId)){ hover(ev); return; }
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  const r=canvas.getBoundingClientRect();
  if(ptrs.size===1 && drag){
    const dx=ev.clientX-drag.x, dy=ev.clientY-drag.y;
    drag.moved=Math.max(drag.moved,Math.hypot(dx,dy));
    if(drag.moved>5){ svg.classList.add('grabbing'); hideTip(); const k=drag.vb.w/r.width; setVB({x:drag.vb.x-dx*k, y:drag.vb.y-dy*k, w:drag.vb.w, h:drag.vb.h}); }
  } else if(ptrs.size===2 && pinch){
    const now=pinchState(), s=pinch.d/now.d, v=pinch.vb;
    const wx=v.x+((pinch.mx-r.left)/r.width)*v.w, wy=v.y+((pinch.my-r.top)/r.height)*v.h;
    const w=v.w*s, h=v.h*s;
    setVB({x:wx-((now.mx-r.left)/r.width)*w, y:wy-((now.my-r.top)/r.height)*h, w, h});
  }
});
function endPtr(ev,cancel){
  const d=drag;
  ptrs.delete(ev.pointerId);
  svg.classList.remove('grabbing');
  if(!cancel && d && d.moved<=5 && ptrs.size===0) activate(d.target);
  if(ptrs.size<2) pinch=null;
  if(ptrs.size===0) drag=null;
}
svg.addEventListener('pointerup',ev=>endPtr(ev,false));
svg.addEventListener('pointercancel',ev=>endPtr(ev,true));
svg.addEventListener('pointerleave',()=>hideTip());
svg.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter' && ev.key!==' ') return;
  const n=ev.target.closest && ev.target.closest('[data-id]');
  if(n){ ev.preventDefault(); selectNode(n.getAttribute('data-id')); }
});
let lastW=0;
const onResize=()=>{
  const W=canvas.clientWidth; if(!W) return;
  if(!lastW){ vb=norm(homeView()); applyView(); }
  else if(W!==lastW){ const k=W/lastW, cx=vb.x+vb.w/2, cy=vb.y+vb.h/2; setVB({x:cx-vb.w*k/2, y:cy-vb.h*k/2, w:vb.w*k, h:vb.h*k}); }
  else setVB(vb);
  lastW=W;
};
if(window.ResizeObserver) new ResizeObserver(onResize).observe(canvas); else window.addEventListener('resize',onResize);

/* ---------- tooltip ---------- */
const tip=$('#tip');
function hover(ev){
  if(ev.pointerType!=='mouse'){ return; }
  const g=ev.target.closest && ev.target.closest('[data-edge]');
  if(!g){ hideTip(); return; }
  const e=E[g.getAttribute('data-edge')];
  const r=canvas.getBoundingClientRect();
  tip.innerHTML='<b><span class="sw" style="--c:var(--w-'+e.layer+')"></span>'+esc(edgeLabel(e))+'</b>'+esc(nodeLabel(e.from))+' → '+esc(nodeLabel(e.to))+'<small>'+esc(t('layers')[e.layer])+' · '+esc(t('methods')[e.method]||e.method)+(e.decided?'':' · '+esc(t('undecided')))+'</small>';
  tip.hidden=false;
  let x=ev.clientX-r.left+14, y=ev.clientY-r.top+14;
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  if(x+tw>r.width-8) x=ev.clientX-r.left-tw-14;
  if(y+th>r.height-8) y=ev.clientY-r.top-th-14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){ tip.hidden=true; }

/* ---------- state & focus ---------- */
function activate(target){
  if(!target){ if(state.tour) return; clearSel(); return; }
  if(target.hasAttribute('data-id')) selectNode(target.getAttribute('data-id'));
  else if(target.hasAttribute('data-badge')) selectNode(target.getAttribute('data-badge'));
  else if(target.hasAttribute('data-edge')) selectEdge(target.getAttribute('data-edge'));
}
function selectNode(id,opts){
  if(state.tour) endTour(true);
  state.sel=id; state.selEdge=null;
  applyFocus(); renderPanel();
  if(opts && opts.fit){
    const ids=[id]; EDGES.forEach(e => { if(e.from===id) ids.push(e.to); if(e.to===id) ids.push(e.from); });
    fitIds(ids);
  } else keepClear(N[id]);
}
const overlayPanel = () => window.matchMedia && matchMedia('(min-width:1061px)').matches;
function keepClear(n){
  if(!overlayPanel() || !n) return;
  const R=canvas.getBoundingClientRect(), free=R.width-372;
  const sx=(n.x+n.w/2-vb.x)/vb.w*R.width;
  if(sx>free-20) animateTo({x:vb.x+(sx-free/2)/R.width*vb.w, y:vb.y, w:vb.w, h:vb.h});
}
function selectEdge(id){
  if(state.tour) endTour(true);
  state.selEdge=id; state.sel=null;
  applyFocus(); renderPanel();
  const e=E[id]; if(e){ const a=N[e.from], b=N[e.to]; keepClear(a.x>b.x?a:b); }
}
function clearSel(){ state.sel=null; state.selEdge=null; applyFocus(); renderPanel(); }
function applyVisibility(){
  svg.querySelectorAll('.edge').forEach(g => {
    const e=E[g.getAttribute('data-edge')];
    g.classList.toggle('off', !state.layers.has(e.layer));
  });
  svg.classList.toggle('nojoints', !state.joints);
  svg.classList.toggle('hideplanned', !state.planned);
}
function focusSets(){
  const nodes=new Set(), edges=new Set(); let flow=false;
  if(state.tour){
    const tr=SK.tours.find(x=>x.id===state.tour), st=tr.steps[state.step];
    st.nodes.forEach(n=>nodes.add(n)); st.edges.forEach(e=>edges.add(e)); flow=true;
  } else if(state.sel){
    nodes.add(state.sel);
    EDGES.forEach(e => { if(e.from===state.sel||e.to===state.sel){ edges.add(e.id); nodes.add(e.from); nodes.add(e.to); } });
  } else if(state.selEdge){
    const e=E[state.selEdge]; edges.add(e.id); nodes.add(e.from); nodes.add(e.to);
  } else return null;
  return {nodes,edges,flow};
}
function applyFocus(){
  const fs=focusSets();
  svg.classList.toggle('focus', !!fs);
  gNodes.querySelectorAll('.node').forEach(g => {
    const id=g.getAttribute('data-id');
    g.classList.toggle('hl', !!fs && fs.nodes.has(id));
    g.classList.toggle('sel', state.sel===id);
  });
  gBadges.querySelectorAll('.sbadge').forEach(g => g.classList.toggle('hl', !!fs && fs.nodes.has(g.getAttribute('data-badge'))));
  svg.querySelectorAll('.edge').forEach(g => {
    const id=g.getAttribute('data-edge');
    const on=!!fs && fs.edges.has(id);
    g.classList.toggle('hl', on);
    g.classList.toggle('flowing', on && fs.flow);
  });
}

/* ---------- panel ---------- */
const ep=$('#ep');
function stBadge(st){ return '<span class="stb">'+stIcon(st)+esc(t('st')[st])+'</span>'; }
function renderPanel(){
  let h='';
  if(state.sel){
    const n=N[state.sel], x=nodeTx(n.id)||{};
    h+='<div class="ep-meta">'+stBadge(n.status)+'<span>'+esc(zoneName(n.zone))+'</span></div>';
    h+='<h3>'+esc(nodeLabel(n.id))+'</h3>'+(n.tag?'<div class="ep-tag">'+esc(n.tag)+'</div>':'');
    h+='<p>'+esc(x.what||n.hint)+'</p>';
    if(x.specs) h+='<div class="ep-h">'+esc(t('specs'))+'</div><p>'+esc(x.specs)+'</p>';
    if(x.why) h+='<div class="ep-h">'+esc(t('why'))+'</div><p>'+esc(x.why)+'</p>';
    const sj=solderTx(n.id);
    if(sj && SOLDER_NO[n.id]){
      h+='<div class="ep-h"><span class="badge">'+SOLDER_NO[n.id]+'</span>'+esc(t('soldering'))+'</div><div class="ep-solder"><p>'+esc(sj.what)+'</p>'+(sj.caution?'<p class="ep-caution"><b>'+esc(t('careful'))+'</b>'+esc(sj.caution)+'</p>':'')+'</div>';
    } else if(x.solder){
      h+='<div class="ep-h">'+esc(t('soldering'))+'</div><p>'+esc(x.solder)+'</p>';
    }
    const inc=EDGES.filter(e=>e.from===n.id||e.to===n.id).sort((a,b)=>LAYERS.indexOf(a.layer)-LAYERS.indexOf(b.layer));
    h+='<div class="ep-h">'+esc(t('connections'))+'<span class="n">'+inc.length+'</span></div><ul class="conns">';
    inc.forEach(e => {
      const o=e.from===n.id?e.to:e.from, dir=e.from===n.id?'→':'←';
      h+='<li class="'+(state.layers.has(e.layer)?'':'off')+'"><button type="button" data-edge="'+e.id+'"><i class="'+(e.decided?'':'und')+'" style="--c:var(--w-'+e.layer+')"></i><span class="c-l">'+esc(edgeLabel(e))+'</span><span class="c-o">'+dir+' '+esc(nodeLabel(o))+' · '+esc(t('methods')[e.method]||e.method)+'</span></button></li>';
    });
    h+='</ul>';
  } else if(state.selEdge){
    const e=E[state.selEdge];
    h+='<div class="ep-meta"><span class="stb"><svg viewBox="0 0 16 6" style="width:18px"><rect width="16" height="4" y="1" rx="2" style="fill:var(--w-'+e.layer+')"/></svg>'+esc(t('layers')[e.layer])+'</span><span>'+esc(e.decided?t('decided'):t('undecided'))+'</span></div>';
    h+='<h3>'+esc(edgeLabel(e))+'</h3>';
    h+='<div class="ep-ends"><button type="button" class="ep-link" data-node="'+e.from+'"><span>'+esc(t('from'))+'</span><span class="c-l">'+esc(nodeLabel(e.from))+'</span></button><button type="button" class="ep-link" data-node="'+e.to+'"><span>'+esc(t('to'))+'</span><span class="c-l">'+esc(nodeLabel(e.to))+'</span></button></div>';
    h+='<div class="ep-h">'+esc(t('carries'))+'</div><p>'+esc(edgeCarries(e))+'</p>';
    h+='<div class="ep-h">'+esc(t('joinedBy'))+'</div><p>'+esc(t('methods')[e.method]||e.method)+'</p>';
    h+='<div class="ep-h">'+esc(t('layer'))+'</div><p>'+esc(layerHint(e.layer))+'</p>';
  } else {
    h+='<div class="ep-kicker">KLINGELBOX</div><h3>'+esc(t('emptyTitle'))+'</h3><p>'+esc(t('emptyBody'))+'</p>';
    h+='<button type="button" class="ep-cta" data-tour="ring">▶&nbsp; '+esc(t('startRing'))+'</button>';
    h+='<div class="ep-h">'+esc(t('statusLegend'))+'</div><ul class="st-list">'+STATUS_ORDER.map(s=>'<li>'+stIcon(s)+esc(t('st')[s])+'</li>').join('')+'</ul>';
  }
  if(state.sel||state.selEdge) h='<button type="button" class="ep-x" data-act="close" aria-label="Close">×</button>'+h;
  ep.innerHTML=h; ep.scrollTop=0;
  $('.grid').classList.toggle('has-sel', !!(state.sel||state.selEdge));
}
ep.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.getAttribute('data-act')==='close') clearSel();
  else if(b.hasAttribute('data-edge')) selectEdge(b.getAttribute('data-edge'));
  else if(b.hasAttribute('data-node')) selectNode(b.getAttribute('data-node'));
  else if(b.hasAttribute('data-tour')) startTour(b.getAttribute('data-tour'));
});

/* ---------- tours ---------- */
const tourbar=$('#tourbar');
function startTour(id){
  state.tour=id; state.step=0; state.sel=null; state.selEdge=null;
  renderPanel(); showStep();
  const r=canvas.getBoundingClientRect();
  if(r.top<0 || r.bottom>innerHeight) $('#map').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
}
function endTour(silent){
  state.tour=null; tourbar.hidden=true;
  if(!silent){ applyFocus(); }
}
function showStep(){
  const tr=SK.tours.find(x=>x.id===state.tour); if(!tr) return;
  const n=tr.steps.length, i=state.step;
  let dots=''; for(let k=0;k<n;k++) dots+='<button type="button" data-step="'+k+'" class="'+(k===i?'on':(k<i?'done':''))+'" aria-label="'+esc(t('step'))+' '+(k+1)+'"></button>';
  tourbar.innerHTML='<div class="tb-h"><span class="tb-k">'+esc(t('walkthrough'))+(tr.status==='planned'?' · '+esc(t('plannedTag')):'')+'</span><button type="button" class="tb-x" data-act="close" aria-label="Close">×</button></div>'+
    '<div class="tb-t">'+esc(tourTitle(tr))+'</div><p class="tb-s">'+esc(stepText(tr,i))+'</p>'+
    '<div class="tb-f"><div class="tb-dots">'+dots+'</div><div class="tb-nav"><span>'+(i+1)+' / '+n+'</span><button type="button" data-act="prev" '+(i===0?'disabled':'')+'>'+esc(t('prev'))+'</button><button type="button" class="pri" data-act="next">'+esc(i===n-1?t('done'):t('next'))+'</button></div></div>';
  tourbar.hidden=false;
  applyFocus();
  const ids=tr.steps[i].nodes.slice();
  fitIds(ids, 90);
}
tourbar.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  const tr=SK.tours.find(x=>x.id===state.tour); if(!tr) return;
  if(b.hasAttribute('data-step')){ state.step=+b.getAttribute('data-step'); showStep(); return; }
  const a=b.getAttribute('data-act');
  if(a==='close') endTour(false);
  else if(a==='prev' && state.step>0){ state.step--; showStep(); }
  else if(a==='next'){ if(state.step<tr.steps.length-1){ state.step++; showStep(); } else { endTour(false); animateTo(homeView()); } }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ if(state.tour) endTour(false); else if(state.sel||state.selEdge) clearSel(); }
  if(!state.tour) return;
  const tr=SK.tours.find(x=>x.id===state.tour);
  if(ev.key==='ArrowRight' && state.step<tr.steps.length-1){ state.step++; showStep(); }
  if(ev.key==='ArrowLeft' && state.step>0){ state.step--; showStep(); }
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-tour]');
  if(b && !ep.contains(b)){ ev.preventDefault(); startTour(b.getAttribute('data-tour')); }
});

/* ---------- toolbar ---------- */
function renderTools(){
  const pr=$('#presets'); pr.innerHTML='';
  Object.keys(PRESETS).forEach(k => {
    const b=document.createElement('button'); b.type='button'; b.textContent=t(k);
    const set=PRESETS[k];
    b.setAttribute('aria-pressed', String(set.length===state.layers.size && set.every(l=>state.layers.has(l))));
    b.onclick=()=>{ state.layers=new Set(set); state.capLayer=null; renderTools(); applyVisibility(); if(state.sel) renderPanel(); };
    pr.appendChild(b);
  });
  const ch=$('#chips'); ch.innerHTML='';
  const count={}; EDGES.forEach(e=>count[e.layer]=(count[e.layer]||0)+1);
  LAYERS.forEach(l => {
    const b=document.createElement('button'); b.type='button'; b.className='chip';
    b.setAttribute('aria-pressed', String(state.layers.has(l)));
    b.style.setProperty('--c','var(--w-'+l+')');
    b.innerHTML='<i></i><span>'+esc(t('layers')[l])+'</span><small>'+(count[l]||0)+'</small>';
    b.title=layerHint(l);
    b.onclick=()=>{ if(state.layers.has(l)) state.layers.delete(l); else state.layers.add(l); state.capLayer=l; renderTools(); applyVisibility(); if(state.sel) renderPanel(); };
    b.onmouseenter=()=>{ state.capLayer=l; renderCaption(); };
    b.onfocus=()=>{ state.capLayer=l; renderCaption(); };
    ch.appendChild(b);
  });
  $('#tgJoints').checked=state.joints; $('#tgPlanned').checked=state.planned;
  renderCaption();
}
function renderCaption(){
  const c=$('#caption'), l=state.capLayer;
  c.innerHTML = l ? '<b>'+esc(t('layers')[l])+'</b> · '+esc(layerHint(l)) : esc(t('captionIdle'));
}
$('#chips').addEventListener('mouseleave',()=>{ state.capLayer=null; renderCaption(); });
$('#tgJoints').onchange=ev=>{ state.joints=ev.target.checked; applyVisibility(); };
$('#tgPlanned').onchange=ev=>{ state.planned=ev.target.checked; applyVisibility(); };

}
function renderLower(){
  $('#tours').innerHTML=SK.tours.map((tr,i)=>'<li class="'+(tr.status==='planned'?'planned':'')+'"><button type="button" data-tour="'+tr.id+'"><span class="tn">'+String(i+1).padStart(2,'0')+'</span><span class="tt">'+esc(tourTitle(tr))+'</span><span class="ts">'+tr.steps.length+' '+esc(t('steps'))+'</span></button></li>').join('');
  $('#solder').innerHTML=SK.solder.map((s,i)=>{ const x=solderTx(s.node)||{}; return '<li><span class="badge">'+(i+1)+'</span><h4><button type="button" data-show="'+s.node+'">'+esc(nodeLabel(s.node))+'</button></h4><p>'+esc(x.what||s.hint)+'</p>'+(x.caution?'<p class="cau"><b>'+esc(t('careful'))+'</b>'+esc(x.caution)+'</p>':'')+'</li>'; }).join('');
  $('#solderCount').textContent=SK.solder.length;
  const nodes=Object.values(N).filter(n=>n.kind!=='rail' || true);
  const counts={}; nodes.forEach(n=>counts[n.status]=(counts[n.status]||0)+1);
  $('#counts').innerHTML=STATUS_ORDER.filter(s=>counts[s]).map(s=>'<span class="stb">'+stIcon(s)+'<b>'+counts[s]+'</b> '+esc(t('st')[s])+'</span>').join('');
  $('#partsCount').textContent=nodes.length;
  const sorted=nodes.slice().sort((a,b)=>(ZONE_ORDER.indexOf(a.zone)-ZONE_ORDER.indexOf(b.zone))||(STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status)));
  $('#parts').innerHTML=sorted.map(n=>'<tr data-node="'+n.id+'"><td><b>'+esc(nodeLabel(n.id))+'</b></td><td class="mono">'+esc(n.tag)+'</td><td>'+stBadge(n.status)+'</td><td>'+esc(zoneName(n.zone))+'</td></tr>').join('');
  const pend = (TX.pending && TX.pending.length) ? TX.pending.map(p => p[lang] || p.en) : (lang==='de' && UI.de.pending ? UI.de.pending : SK.pending);
  $('#open').innerHTML=pend.map(p=>'<li>'+esc(p)+'</li>').join('');
  $('#openCount').textContent=pend.length;
  const pl=$('#plate'); pl.innerHTML=t('plate').map(r=>'<dt>'+esc(r[0])+'</dt><dd class="'+(r[0]==='Camera'||r[0]==='Kamera'?'none':'')+'">'+esc(r[1])+'</dd>').join('');
  const d=new Date((DATA.state||'2026-09-24')+'T12:00:00');
  $('#state').textContent=t('stateOf')+' '+(lang==='de'?d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}));
}
function showOnMap(id){ selectNode(id,{fit:true}); $('#map').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'}); }
$('#parts').addEventListener('click',ev=>{ const tr=ev.target.closest('tr[data-node]'); if(tr) showOnMap(tr.getAttribute('data-node')); });
$('#solder').addEventListener('click',ev=>{ const b=ev.target.closest('[data-show]'); if(b) showOnMap(b.getAttribute('data-show')); });


/* ---------- roadmap ---------- */
const MS = SK.milestones || [];
const TRACK_COLOR = {plan:'var(--ink-2)',hw:'var(--w-ethernet)',sw:'var(--w-poe)',wx:'var(--w-wifi)',box:'var(--brass-2)'};
function msTx(id){ const x=(TX.milestones||{})[id]; return (x && (x[lang]||x.en)) || {title:id,why:'',done_when:'',tasks:{}}; }
function msNo(id){ return 'M'+MS.findIndex(m=>m.id===id); }
function msProg(m){ return [m.tasks.filter(k=>k.status==='done').length, m.tasks.length]; }
function taskIcon(st){
  if(st==='done') return '<svg viewBox="0 0 16 16" class="ti ti-done" aria-hidden="true"><circle cx="8" cy="8" r="7"/><path d="M4.6 8.3 7 10.6l4.4-5"/></svg>';
  if(st==='doing') return '<svg viewBox="0 0 16 16" class="ti ti-doing" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z"/></svg>';
  if(st==='waiting') return '<svg viewBox="0 0 16 16" class="ti ti-waiting" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/></svg>';
  if(st==='decide') return '<svg viewBox="0 0 16 16" class="ti ti-decide" aria-hidden="true"><rect x="3.4" y="3.4" width="9.2" height="9.2" rx="1" transform="rotate(45 8 8)"/></svg>';
  return '<svg viewBox="0 0 16 16" class="ti ti-open" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/></svg>';
}
function roundPath(P,R){
  R=R||8; let d='M'+P[0][0]+' '+P[0][1], cur=P[0];
  for(let i=1;i<P.length;i++){
    const b=P[i], c=P[i+1];
    if(c){
      const l1=Math.hypot(b[0]-cur[0],b[1]-cur[1]), l2=Math.hypot(c[0]-b[0],c[1]-b[1]), r=Math.min(R,l1/2,l2/2);
      const e=[b[0]-(b[0]-cur[0])/l1*r, b[1]-(b[1]-cur[1])/l1*r], o=[b[0]+(c[0]-b[0])/l2*r, b[1]+(c[1]-b[1])/l2*r];
      d+=' L'+f(e[0])+' '+f(e[1])+' Q'+b[0]+' '+b[1]+' '+f(o[0])+' '+f(o[1]); cur=o;
    } else { d+=' L'+b[0]+' '+b[1]; cur=b; }
  }
  return d;
}
function shortLock(text){
  let s=text, pre=t('lockPrefix');
  if(s.indexOf(pre)===0) s=s.slice(pre.length);
  s=s.replace(/ *\([^)]*\)/g,'').replace(/, after .*$/,'').trim();
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function renderRoadmap(){
  const rs=$('#rmsvg'); if(!rs || !MS.length || !LY.roadmap) return;
  const R=LY.roadmap; rs.setAttribute('viewBox', R.viewBox.join(' '));
  rs.setAttribute('aria-label', t('roadmapTitle'));
  rs.innerHTML='';
  el('defs',null,rs,'<marker id="rmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--muted)"/></marker>');
  const gL=el('g',{class:'rm-links'},rs);
  R.links.forEach(l=>{
    const g=el('g',{class:'rm-link'+(l.soft?' soft':''),'data-from':l.from,'data-to':l.to},gL);
    el('path',{d:roundPath(l.pts),class:'rm-wire','marker-end':'url(#rmArrow)'},g);
    if(l.soft){ const a=l.pts[0], b=l.pts[1]; txt(g,{x:f((a[0]+b[0])/2),y:a[1]-7,'text-anchor':'middle',class:'rm-soft-l'},t('rmProvides')); }
  });
  const gC=el('g',{class:'rm-cards'},rs);
  MS.forEach((m,i)=>{
    const c=R.cards[m.id]; if(!c) return;
    const [x,y,w,h]=c, tx=msTx(m.id), pr=msProg(m), dec=m.tasks.filter(k=>k.status==='decide').length;
    const g=el('g',{class:'rm-card st-'+m.status+(m.track==='wx'?' explore':''),'data-ms':m.id,tabindex:0,role:'button','aria-label':'M'+i+' '+tx.title+', '+t('msSt')[m.status]},gC);
    el('rect',{x,y,width:w,height:h,rx:10,class:'rm-bg'},g);
    el('rect',{x:x+.6,y:y+12,width:4,height:h-24,rx:2,style:'fill:'+TRACK_COLOR[m.track]},g);
    const pl=t('msSt')[m.status].toUpperCase(); mctx.font='600 9.5px "JetBrains Mono", Consolas, monospace';
    const pw=mctx.measureText(pl).width+14;
    // header "M1 · TRACK": drop the track name when it would run under the status pill
    mctx.font='500 10px "JetBrains Mono", Consolas, monospace';
    const kw=s=>mctx.measureText(s.toUpperCase()).width+s.length*0.6, kroom=w-16-pw-22;
    let kline='M'+i+' · '+t('tracks')[m.track]; if(m.track==='wx') kline+=' · '+t('exploratory');
    if(kw(kline)>kroom) kline='M'+i+(m.track==='wx' && kw('M'+i+' · '+t('exploratory'))<=kroom ? ' · '+t('exploratory') : '');
    txt(g,{x:x+16,y:y+23,class:'rm-k'},kline);
    const pg=el('g',{class:'rm-pill p-'+m.status},g);
    el('rect',{x:f(x+w-12-pw),y:y+10,width:f(pw),height:18,rx:9},pg);
    txt(pg,{x:f(x+w-12-pw/2),y:y+22.5,'text-anchor':'middle'},pl);
    const lines=wrap(tx.title,'600 16px Barlow, "Segoe UI", system-ui, sans-serif',w-34,2);
    lines.forEach((ln,k)=>txt(g,{x:x+16,y:y+48+k*19,class:'rm-t'},ln));
    const bw=w-16-16-(dec?78:48), by=y+h-21;
    el('rect',{x:x+16,y:by,width:bw,height:6,rx:3,class:'rm-barbg'},g);
    if(pr[0]) el('rect',{x:x+16,y:by,width:f(bw*pr[0]/pr[1]),height:6,rx:3,class:'rm-bar'},g);
    txt(g,{x:x+w-16,y:by+6.5,'text-anchor':'end',class:'rm-n'},pr[0]+'/'+pr[1]);
    if(dec){ const dx=x+w-62, dy=by+3; el('rect',{x:dx-4,y:dy-4,width:8,height:8,rx:1,class:'rm-dia',transform:'rotate(45 '+dx+' '+dy+')'},g); txt(g,{x:dx+8,y:by+6.5,class:'rm-n'},String(dec)); }
  });
  const lgPill=(s)=>'<span class="pill p-'+s+'">'+esc(t('msSt')[s])+'</span>';
  const line=(style)=>'<svg viewBox="0 0 26 12" aria-hidden="true"><path d="M1 6h20" fill="none" stroke-width="1.8" style="stroke:var(--muted);'+style+'"/><path d="M19 2.5 25 6l-6 3.5z" style="fill:var(--muted)"/></svg>';
  $('#rmLegend').innerHTML=['now','next','later','done'].map(lgPill).join(' ')+
    '<span class="lg">'+line('')+esc(t('lgNeeds'))+'</span>'+
    '<span class="lg">'+line('stroke-dasharray:4 4')+esc(t('lgProvides'))+'</span>'+
    '<span class="lg"><svg viewBox="0 0 26 12" aria-hidden="true"><rect x="1" y="1" width="24" height="10" rx="3" fill="none" stroke-width="1.4" style="stroke:var(--ink-2);stroke-dasharray:4 3"/></svg>'+esc(t('lgExplore'))+'</span>'+
    '<span class="lg"><span class="dia"></span>'+esc(t('lgDecision'))+'</span>'+
    Object.keys(TRACK_COLOR).map(k=>'<span class="lg"><i class="trk" style="background:'+TRACK_COLOR[k]+'"></i>'+esc(t('tracks')[k])+'</span>').join('');
  const locks=[]; MS.forEach(m=>m.tasks.forEach(k=>{ if(k.status==='decide') locks.push([m,k]); }));
  $('#lockins').innerHTML='<div class="lk-h">'+esc(t('lockins'))+'<small>'+locks.length+'</small></div><ul class="lk">'+
    locks.map(([m,k])=>'<li><button type="button" data-ms-open="'+m.id+'"><span class="dia"></span><span>'+esc(shortLock(msTx(m.id).tasks[k.id]||k.id))+'</span><span class="lk-m">'+msNo(m.id)+'</span></button></li>').join('')+'</ul>';
  $('#rmList').innerHTML=MS.map((m,i)=>{
    const tx=msTx(m.id), pr=msProg(m);
    let h='<details class="ms" id="ms-'+m.id+'"><summary><span class="ms-n">M'+i+'</span><span class="ms-t">'+esc(tx.title)+'<small>'+esc(t('tracks')[m.track])+(m.track==='wx'?' · '+esc(t('exploratory')):'')+'</small></span>'+
      '<span class="pill p-'+m.status+'">'+esc(t('msSt')[m.status])+'</span><span class="ms-p"><i style="--p:'+Math.round(100*pr[0]/pr[1])+'%"></i>'+pr[0]+'/'+pr[1]+'</span></summary><div class="ms-b">';
    h+='<p class="ms-why">'+esc(tx.why)+'</p>';
    const needs=m.needs.concat(m.soft||[]);
    if(needs.length) h+='<div class="ms-needs"><span>'+esc(t('needs'))+':</span>'+needs.map(n=>'<button type="button" data-ms-open="'+n+'">'+msNo(n)+' · '+esc(msTx(n).title)+'</button>').join('')+'</div>';
    h+='<ol class="tasks">'+m.tasks.map(k=>'<li class="tk st-'+k.status+'">'+taskIcon(k.status)+'<span class="tk-t">'+esc(tx.tasks[k.id]||k.id)+(k.node&&N[k.node]?'<button type="button" data-show="'+k.node+'">'+esc(t('onMap'))+' ↗</button>':'')+'</span><span class="tk-s">'+esc(t('tkSt')[k.status])+'</span></li>').join('')+'</ol>';
    h+='<div class="ms-exit"><b>'+esc(t('doneWhen'))+'</b>'+esc(tx.done_when)+'</div></div></details>';
    return h;
  }).join('');
}
function openMs(id){
  const d=document.getElementById('ms-'+id); if(!d) return;
  d.open=true;
  document.querySelectorAll('#rmsvg .rm-card').forEach(g=>g.classList.toggle('sel', g.getAttribute('data-ms')===id));
  d.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
  d.classList.add('flash'); setTimeout(()=>d.classList.remove('flash'),1200);
}
function rmFocus(id){
  const rs=$('#rmsvg'); rs.classList.toggle('rm-focus', !!id);
  rs.querySelectorAll('.rm-link').forEach(l=>l.classList.toggle('hl', !!id && (l.getAttribute('data-from')===id || l.getAttribute('data-to')===id)));
  rs.querySelectorAll('.rm-card').forEach(c=>{ const m=c.getAttribute('data-ms'); c.classList.toggle('hl', !!id && (m===id || [...rs.querySelectorAll('.rm-link.hl')].some(l=>l.getAttribute('data-from')===m || l.getAttribute('data-to')===m))); });
}
$('#rmsvg').addEventListener('click',ev=>{ const c=ev.target.closest('[data-ms]'); if(c) openMs(c.getAttribute('data-ms')); });
$('#rmsvg').addEventListener('keydown',ev=>{ if(ev.key!=='Enter' && ev.key!==' ') return; const c=ev.target.closest && ev.target.closest('[data-ms]'); if(c){ ev.preventDefault(); openMs(c.getAttribute('data-ms')); } });
$('#rmsvg').addEventListener('pointerover',ev=>{ const c=ev.target.closest('[data-ms]'); rmFocus(c?c.getAttribute('data-ms'):null); });
$('#rmsvg').addEventListener('pointerleave',()=>rmFocus(null));
$('#roadmap').addEventListener('click',ev=>{
  const o=ev.target.closest('[data-ms-open]'); if(o){ ev.preventDefault(); openMs(o.getAttribute('data-ms-open')); return; }
  const sh=ev.target.closest('[data-show]'); if(sh){ ev.preventDefault(); showOnMap(sh.getAttribute('data-show')); }
});

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(n=>{ const v=t(n.getAttribute('data-t')); if(typeof v==='string') n.textContent=v; });
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed', String(b.getAttribute('data-lang')===lang)));
  svg.setAttribute('aria-label', lang==='de'?'Schaltplan der Klingelbox':'Wiring map of the Klingelbox');
  renderTools(); renderLegend(); renderLower(); renderRoadmap(); renderSVG(); renderPanel();
  if(state.tour) showStep();
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.getAttribute('data-lang'); store.set('kb-lang',lang); applyLang(); });

vb=norm(homeView());
applyLang();
requestAnimationFrame(()=>{ if(canvas.clientWidth){ lastW=canvas.clientWidth; vb=norm(homeView()); applyView(); } });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ renderSVG(); renderRoadmap(); });
})();
</script>
