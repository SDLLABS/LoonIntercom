<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klingelbox Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --sans:Barlow,"Segoe UI",system-ui,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ground:#E4E3DD; --paper:#F3F2EE; --paper-2:#ECEBE5; --ink:#1B1C1A; --ink-2:#3B3C38; --muted:#65665F; --faint:#8E8F87;
  --rule:#CAC8BF; --rule-2:#DAD8D0;
  --brass:#8C6420; --brass-2:#B48A3A; --brass-3:#D9BF83; --brass-wash:#EEE4CB;
  --front-a:#EDE3C6; --front-b:#E0D0A6; --brushed:rgba(140,100,32,.08);
  --z-internet:#DCE1E3; --z-house:#E9E5DA; --z-tech:#DEE2DA; --z-box:#D4D3CC; --z-boxwall:#2A2B28; --layerline:rgba(27,28,26,.06);
  --hatch:rgba(27,28,26,.2); --wall:#ECEBE5;
  --pcb:#1D2923; --pcb-2:#2A3831; --pcb-ink:#E8E6DD; --pin:#C9A55A; --shield:#B9BBB5; --metal:#9FA19B;
  --epaper:#E9E8E1; --epaper-ink:#232420; --ep-muted:#5F605A; --ep-rule:#CFCDC4; --bezel:#262724;
  --card-stroke:#A6A49B; --flow:#FFFFFF; --tip:#1B1C1A; --tip-ink:#F3F2EE;
  --shadow:0 1px 2px rgba(27,28,26,.08),0 10px 28px rgba(27,28,26,.10);
  --w-mains:#6B4226; --w-poe:#6741D9; --w-ethernet:#0B7285; --w-wifi:#1C7ED6; --w-v12:#E8590C; --w-v5:#E03131; --w-v3:#E67700;
  --w-gnd:#2C2E2A; --w-earth:#2B8A3E; --w-earth2:#EDBE00; --w-i2c:#2F9E44; --w-i2s:#D6336C; --w-gpio:#5C940D; --w-button:#A87B2E;
  --w-speaker:#9C5B30; --w-software:#5C6977; --w-mech:#8A8478; --wago:#F08C00; --solder:#A3A59F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#121311; --paper:#1C1D1A; --paper-2:#171815; --ink:#ECEAE2; --ink-2:#D0CEC5; --muted:#9E9C93; --faint:#76756D;
  --rule:#34352F; --rule-2:#2A2B27;
  --brass:#D6B267; --brass-2:#B8913F; --brass-3:#7A5E27; --brass-wash:#241F14;
  --front-a:#2A2416; --front-b:#1F1A10; --brushed:rgba(214,178,103,.05);
  --z-internet:#171B1D; --z-house:#1B1A16; --z-tech:#161A16; --z-box:#0C0D0B; --z-boxwall:#4A4B44; --layerline:rgba(236,234,226,.04);
  --hatch:rgba(236,234,226,.16); --wall:#1A1B18;
  --pcb:#0E1813; --pcb-2:#1A2A21; --pcb-ink:#E8E6DD; --pin:#B8944A; --shield:#8D8F89; --metal:#70726C;
  --epaper:#CFCDC4; --epaper-ink:#1B1C19; --ep-muted:#56574F; --ep-rule:#B5B3AA; --bezel:#050605;
  --card-stroke:#4B4C46; --flow:#FFFFFF; --tip:#ECEAE2; --tip-ink:#121311;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
  --w-mains:#C08A5E; --w-poe:#9775FA; --w-ethernet:#3BC9DB; --w-wifi:#4DABF7; --w-v12:#FF922B; --w-v5:#FF6B6B; --w-v3:#FFC078;
  --w-gnd:#A6A69E; --w-earth:#51CF66; --w-earth2:#FFD43B; --w-i2c:#69DB7C; --w-i2s:#F783AC; --w-gpio:#A9E34B; --w-button:#D6B267;
  --w-speaker:#E0A075; --w-software:#A5B1BE; --w-mech:#8F897D; --wago:#FFA94D; --solder:#C4C6C0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#121311; --paper:#1C1D1A; --paper-2:#171815; --ink:#ECEAE2; --ink-2:#D0CEC5; --muted:#9E9C93; --faint:#76756D;
  --rule:#34352F; --rule-2:#2A2B27;
  --brass:#D6B267; --brass-2:#B8913F; --brass-3:#7A5E27; --brass-wash:#241F14;
  --front-a:#2A2416; --front-b:#1F1A10; --brushed:rgba(214,178,103,.05);
  --z-internet:#171B1D; --z-house:#1B1A16; --z-tech:#161A16; --z-box:#0C0D0B; --z-boxwall:#4A4B44; --layerline:rgba(236,234,226,.04);
  --hatch:rgba(236,234,226,.16); --wall:#1A1B18;
  --pcb:#0E1813; --pcb-2:#1A2A21; --pcb-ink:#E8E6DD; --pin:#B8944A; --shield:#8D8F89; --metal:#70726C;
  --epaper:#CFCDC4; --epaper-ink:#1B1C19; --ep-muted:#56574F; --ep-rule:#B5B3AA; --bezel:#050605;
  --card-stroke:#4B4C46; --flow:#FFFFFF; --tip:#ECEAE2; --tip-ink:#121311;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
  --w-mains:#C08A5E; --w-poe:#9775FA; --w-ethernet:#3BC9DB; --w-wifi:#4DABF7; --w-v12:#FF922B; --w-v5:#FF6B6B; --w-v3:#FFC078;
  --w-gnd:#A6A69E; --w-earth:#51CF66; --w-earth2:#FFD43B; --w-i2c:#69DB7C; --w-i2s:#F783AC; --w-gpio:#A9E34B; --w-button:#D6B267;
  --w-speaker:#E0A075; --w-software:#A5B1BE; --w-mech:#8F897D; --wago:#FFA94D; --solder:#C4C6C0;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding-inline:clamp(16px,3vw,36px);padding-block:0 64px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--rule)}
.mark{display:flex;align-items:center;gap:10px;font:600 15px/1 var(--cond);letter-spacing:.18em;text-transform:uppercase}
.mark svg{width:22px;height:22px;color:var(--brass)}
.bar-r{display:flex;align-items:center;gap:14px}
.bar-r a{font:500 13px var(--sans);color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule)}
.bar-r a:hover{color:var(--ink);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;background:var(--paper)}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:999px;font:600 12px/1.2 var(--mono);letter-spacing:.06em;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:end;padding-block:clamp(28px,5vw,60px) clamp(18px,3vw,30px)}
.kicker{font:600 12.5px/1 var(--cond);letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
h1{font:700 clamp(46px,8vw,96px)/.88 var(--cond);letter-spacing:.005em;margin:.22em 0 .22em;text-transform:uppercase;text-wrap:balance}
.lede{max-width:62ch;font-size:clamp(15px,1.25vw,17px);color:var(--ink-2);margin:0}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);font:600 14px var(--sans);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn:hover{filter:brightness(1.12)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.plate{position:relative;border:1.5px solid var(--brass-2);border-radius:6px;background:var(--brass-wash);padding:24px 30px 22px;font:500 12.5px/1.45 var(--mono);color:var(--ink)}
.plate-h{display:flex;justify-content:space-between;gap:12px;font:600 12px/1 var(--cond);letter-spacing:.24em;text-transform:uppercase;color:var(--brass);padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--brass-3)}
.plate dl{display:grid;grid-template-columns:auto 1fr;gap:5px 18px;margin:0}
.plate dt{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;padding-top:1px}
.plate dd{margin:0;font-variant-numeric:tabular-nums}
.plate .none{color:var(--brass);font-weight:600}
.plate .screw{position:absolute;width:11px;height:11px}
.plate .screw.a{left:8px;top:8px}.plate .screw.b{right:8px;top:8px}.plate .screw.c{left:8px;bottom:8px}.plate .screw.d{right:8px;bottom:8px}

/* stage */
.stage{scroll-margin-top:12px}
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding-block:10px 8px}
.presets{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:3px}
.presets button{border:0;background:transparent;border-radius:6px;padding:5px 12px;font:600 13px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.toggles{display:flex;flex-wrap:wrap;gap:6px 16px}
.tg{display:inline-flex;align-items:center;gap:7px;font:500 13.5px var(--sans);color:var(--ink-2);cursor:pointer;user-select:none}
.tg input{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--rule);position:relative;margin:0;cursor:pointer;transition:background .2s}
.tg input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--paper);transition:transform .2s}
.tg input:checked{background:var(--brass-2)}
.tg input:checked::after{transform:translateX(12px)}
.tg input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-block:2px 6px}
.chip{display:inline-flex;align-items:stretch;height:28px;padding:0;border:1px solid var(--rule);border-radius:4px;background:var(--paper);cursor:pointer;overflow:hidden;font:500 13px/26px var(--sans);color:var(--ink)}
.chip i{width:9px;background:var(--c);flex:none}
.chip span{padding:0 9px 0 8px;white-space:nowrap}
.chip small{font:500 10.5px/26px var(--mono);color:var(--faint);padding-right:8px}
.chip[aria-pressed="false"]{background:transparent;color:var(--faint);border-style:dashed}
.chip[aria-pressed="false"] i{background:transparent;border-right:1px dashed var(--rule)}
.chip:focus-visible,.presets button:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.caption{min-height:1.55em;color:var(--muted);font-size:13.5px;padding-block:0 8px}
.caption b{color:var(--ink);font-weight:600}

.grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.canvas{position:relative;width:100%;aspect-ratio:1600/1000;max-height:82vh;background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.canvas svg{width:100%;height:100%;display:block;cursor:grab}
.canvas svg.grabbing{cursor:grabbing}
.zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:7px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:500 18px/1 var(--mono);cursor:pointer;box-shadow:var(--shadow)}
.zoom button:hover{border-color:var(--ink)}
.tip{position:absolute;pointer-events:none;max-width:300px;background:var(--tip);color:var(--tip-ink);font:400 12.5px/1.45 var(--sans);padding:8px 10px;border-radius:6px;box-shadow:var(--shadow);z-index:3}
.tip b{display:block;font-weight:600;font-size:13px}
.tip .sw{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--c);vertical-align:middle;margin-right:6px}
.tip small{display:block;opacity:.7;font:500 11px var(--mono);margin-top:3px}
.tourbar{position:absolute;left:12px;bottom:12px;right:12px;max-width:580px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px 12px;z-index:4}
.tb-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tb-k{font:600 11.5px var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.tb-t{font:600 17px/1.2 var(--cond);letter-spacing:.02em;margin:2px 0 6px}
.tb-x{border:0;background:transparent;font:500 18px/1 var(--mono);color:var(--muted);cursor:pointer;padding:2px 4px}
.tb-s{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.tb-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.tb-dots{display:flex;gap:4px;flex-wrap:wrap}
.tb-dots button{width:22px;height:5px;border-radius:3px;border:0;background:var(--rule);cursor:pointer;padding:0}
.tb-dots button.on{background:var(--brass-2)}
.tb-dots button.done{background:var(--ink-2)}
.tb-nav{display:flex;align-items:center;gap:6px;font:500 12px var(--mono);color:var(--muted)}
.tb-nav button{height:30px;min-width:34px;padding:0 10px;border-radius:6px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font:600 13px var(--sans)}
.tb-nav button.pri{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tb-nav button:disabled{opacity:.35;cursor:default}

/* e-paper panel */
.panel{position:relative;background:var(--bezel);border-radius:12px;padding:10px;min-height:440px;box-shadow:var(--shadow)}
@media (min-width:1061px){.panel{position:absolute;top:10px;right:10px;bottom:10px;width:350px;min-height:0;transform:translateX(calc(100% + 24px));opacity:0;visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s,visibility 0s .35s;z-index:5}.grid.has-sel .panel{transform:none;opacity:1;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}.grid.has-sel .zoom{right:372px}.zoom{transition:right .35s cubic-bezier(.2,.8,.2,1)}}
.ep-x{position:absolute;top:8px;right:8px;width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--ep-muted);font:500 20px/1 var(--mono);cursor:pointer}
.ep-x:hover{background:rgba(0,0,0,.07);color:var(--epaper-ink)}
.ep{position:absolute;inset:10px;padding-right:40px!important;background:var(--epaper);color:var(--epaper-ink);border-radius:3px;padding:18px 18px 22px;overflow:auto;font-size:14px;line-height:1.52;scrollbar-width:thin}
.ep-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font:500 11px var(--mono);letter-spacing:.04em;color:var(--ep-muted);text-transform:uppercase}
.ep h3{font:700 24px/1.05 var(--cond);letter-spacing:.01em;margin:10px 0 2px;text-transform:uppercase;text-wrap:balance}
.ep-tag{font:500 12px var(--mono);color:var(--ep-muted)}
.ep p{margin:10px 0 0}
.ep-h{display:flex;align-items:center;gap:8px;font:600 12px var(--cond);letter-spacing:.18em;text-transform:uppercase;color:var(--ep-muted);margin:18px 0 0;padding-top:12px;border-top:1px solid var(--ep-rule)}
.ep-h .n{font:500 11px var(--mono);letter-spacing:0}
.ep-h + p{margin-top:6px}
.ep-solder{margin-top:4px}
.ep-caution{padding:8px 10px;border-left:3px solid var(--epaper-ink);background:rgba(0,0,0,.04)}
.ep-caution b{font:700 11px var(--cond);letter-spacing:.14em;text-transform:uppercase;margin-right:4px}
.ep-kicker{font:600 11px var(--cond);letter-spacing:.24em;color:var(--ep-muted)}
.ep-cta{margin-top:14px;display:flex;width:100%;align-items:center;gap:10px;border:1.5px solid var(--epaper-ink);background:transparent;color:var(--epaper-ink);border-radius:6px;padding:10px 12px;font:600 14px var(--sans);cursor:pointer;text-align:left}
.ep-cta:hover{background:var(--epaper-ink);color:var(--epaper)}
.conns{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.conns button,.ep-link{display:grid;grid-template-columns:18px 1fr;gap:0 8px;width:100%;text-align:left;border:0;background:transparent;border-radius:4px;padding:5px 6px;cursor:pointer;color:var(--epaper-ink)}
.conns button:hover,.ep-link:hover{background:rgba(0,0,0,.06)}
.conns i{grid-row:span 2;align-self:center;height:4px;border-radius:2px;background:var(--c)}
.conns i.und{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
.c-l{font-weight:600;font-size:13.5px;line-height:1.3}
.c-o{font-size:12.5px;color:var(--ep-muted);line-height:1.3}
.conns .off .c-l{opacity:.6}
.ep-ends{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.ep-link{grid-template-columns:44px 1fr;align-items:baseline}
.ep-link span:first-child{font:500 11px var(--mono);color:var(--ep-muted);text-transform:uppercase}
.st-list{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}
.st-list li,.stb{display:inline-flex;align-items:center;gap:6px}
.stb svg,.st-list svg,.lg svg{width:12px;height:12px;flex:none;overflow:visible}
.badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--brass-2);color:#fff;font:600 11px var(--mono);flex:none}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding-block:10px 0;font-size:12.5px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg svg.w{width:26px;height:10px}
.lg-sep{flex-basis:100%;height:0}
.legend .hint{margin-left:auto;font:500 11.5px var(--mono);color:var(--faint)}

/* svg */
.zone-l{font:600 13px var(--cond);letter-spacing:.2em;text-transform:uppercase;fill:var(--muted)}
.zone-s{font:500 10.5px var(--mono);fill:var(--faint)}
.zone-v{font:500 10px var(--mono);letter-spacing:.08em;fill:var(--muted);text-transform:uppercase}
.node{cursor:pointer;transition:opacity .25s}
.node .card{fill:var(--paper);stroke:var(--card-stroke);stroke-width:1.2}
.node.k-hub .card{stroke:var(--ink);stroke-width:1.8}
.node.st-pending .card{stroke-dasharray:5 4;stroke:var(--ink-2)}
.node.st-planned .card{stroke-dasharray:.5 3.5;stroke-linecap:round;stroke-width:1.6}
.node.st-planned{opacity:.8}
.node:hover .card,.node:focus-visible .card{stroke:var(--ink);stroke-width:1.9}
.node.sel .card,.node.sel .pcb,.node.sel .bez{stroke:var(--brass);stroke-width:2.6}
.node:focus{outline:none}
.lbl{font:600 13px var(--sans);fill:var(--ink)}
.tag{font:500 10.5px var(--mono);fill:var(--muted)}
.gl{color:var(--ink-2)}
.gl *{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.gl [fill="currentColor"]{fill:currentColor}
.k-feature .stripe{fill:var(--brass-2)}
.pcb{fill:var(--pcb);stroke:var(--pcb-2);stroke-width:1.5}
.pin{fill:var(--pin)}
.shield{fill:var(--shield)}
.shield-t{font:600 11px var(--mono);fill:#2A2B28}
.chip-t{font:600 8px var(--mono);fill:#C9C8C0}
.metal{fill:var(--metal)}
.pcb-l{font:600 17px var(--sans);fill:var(--pcb-ink)}
.pcb-t{font:500 10.5px var(--mono);fill:var(--pcb-ink);opacity:.7}
.bez{fill:var(--bezel);stroke:var(--bezel);stroke-width:1}
.epd{fill:var(--epaper)}
.epd-b{fill:var(--epaper-ink);opacity:.55}
.scr-l{font:600 13px var(--sans);fill:var(--pcb-ink)}
.scr-t{font:500 10px var(--mono);fill:var(--pcb-ink);opacity:.7}
.rail-l{font:600 11px var(--mono)}
.sg-fill{fill:var(--ink)} .sg-ring{fill:none;stroke:var(--ink);stroke-width:1.4}
.sg-dash{stroke-dasharray:2.1 1.7} .sg-dot{stroke-dasharray:.1 2.4;stroke-linecap:round;stroke-width:1.9}
.sg-exist{fill:var(--faint)} .sg-brass{fill:var(--brass-2)}
.on-dark .sg-fill{fill:var(--pcb-ink)} .on-dark .sg-ring{stroke:var(--pcb-ink)}
.edge{transition:opacity .25s}

const HZ = s => s==='l' || s==='r';

function ortho(pts,s1,s2){
  const out=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const a=out[out.length-1], b=pts[i];
    if(Math.abs(a.x-b.x)>0.5 && Math.abs(a.y-b.y)>0.5){

  const r=[out[0]];

function layoutEdges(){

  const pinOf=it=>{
    const r=it.e.route, side = it.end===1 ? it.e.s1 : it.e.s2;

    if(p!=null) return p;

    const ol=Math.max(lo,os[0]), oh=Math.min(hi,os[1]);

    const c = HZ(side) ? other.y+other.h/2 : other.x+other.w/2;

      const o = it.end===1 ? it.e.a2 : it.e.a1;

function hopSeg(a,b,e){

/* ---------- view: pan & zoom ---------- */
const canvas=$('#canvas');
const VB0=LY.viewBox;
let vb={x:VB0[0],y:VB0[1],w:VB0[2],h:VB0[3]}, anim=null;
function aspect(){ const r=canvas.getBoundingClientRect(); return (r.width||1)/(r.height||1); }
function norm(v){
  const ar=aspect(), cx=v.x+v.w/2, cy=v.y+v.h/2;
  let w=v.w, h=v.h;
  if(w/h>ar) h=w/ar; else w=h*ar;
  const maxW=Math.max(VB0[2]*1.15, VB0[3]*1.15*ar);
  if(w>maxW){ w=maxW; h=w/ar; }
  if(w<200){ w=200; h=w/ar; }
  const ncx=Math.max(VB0[0], Math.min(VB0[0]+VB0[2], cx)), ncy=Math.max(VB0[1], Math.min(VB0[1]+VB0[3], cy));
  return {x:ncx-w/2, y:ncy-h/2, w, h};
}
function applyView(){ svg.setAttribute('viewBox', f(vb.x)+' '+f(vb.y)+' '+f(vb.w)+' '+f(vb.h)); }
function setVB(v){ if(anim){ cancelAnimationFrame(anim); anim=null; } vb=norm(v); applyView(); }
function animateTo(v){
  const to=norm(v);
  if(reduced){ vb=to; applyView(); return; }
  if(anim) cancelAnimationFrame(anim);
  const from=Object.assign({},vb), t0=performance.now(), D=480;
  const ease=u=>1-Math.pow(1-u,3);
  const tick=now=>{
    const u=Math.min(1,(now-t0)/D), k=ease(u);
    vb={x:from.x+(to.x-from.x)*k, y:from.y+(to.y-from.y)*k, w:from.w+(to.w-from.w)*k, h:from.h+(to.h-from.h)*k};
    applyView();
    anim = u<1 ? requestAnimationFrame(tick) : null;
  };
  anim=requestAnimationFrame(tick);
}
function homeView(){
  const ar=aspect();
  if(ar<1.05) return {x:360, y:VB0[1], w:VB0[3]*ar, h:VB0[3]};
  return {x:VB0[0], y:VB0[1], w:VB0[2], h:VB0[3]};
}
function fitIds(ids,pad){
  pad=pad||70;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ids.forEach(id => { const n=N[id]; if(!n) return; x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x+n.w); y1=Math.max(y1,n.y+n.h); });
  if(x0>x1) return;
  // the part of the canvas not covered by the detail panel or the walkthrough bar
  const R=canvas.getBoundingClientRect();
  const right = R.width - (overlayPanel() && $('.grid').classList.contains('has-sel') ? 372 : 0);
  const bottom = R.height - (state.tour && !tourbar.hidden ? tourbar.offsetHeight + 24 : 0);
  const rw=Math.max(120,right), rh=Math.max(120,bottom);
  const maxS = R.width / Math.min(VB0[2], R.width/R.height<1.05 ? 420 : 640);
  const s = Math.min(rw/(x1-x0+2*pad), rh/(y1-y0+2*pad), maxS);
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  animateTo({x:cx-(rw/2)/s, y:cy-(rh/2)/s, w:R.width/s, h:R.height/s});
}
function zoomAt(k,cx,cy){
  const r=canvas.getBoundingClientRect();
  const wx = vb.x + ((cx==null ? r.width/2 : cx-r.left)/r.width)*vb.w;
  const wy = vb.y + ((cy==null ? r.height/2 : cy-r.top)/r.height)*vb.h;
  const w=vb.w*k, h=vb.h*k;
  setVB({x:wx-(wx-vb.x)*k, y:wy-(wy-vb.y)*k, w, h});
}
$('#zIn').onclick=()=>zoomAt(1/1.35);
$('#zOut').onclick=()=>zoomAt(1.35);
$('#zFit').onclick=()=>animateTo(homeView());
svg.addEventListener('wheel',ev=>{
  if(!(ev.ctrlKey||ev.metaKey)) return;
  ev.preventDefault();
  zoomAt(Math.exp(ev.deltaY*0.0022), ev.clientX, ev.clientY);
},{passive:false});
const ptrs=new Map(); let drag=null, pinch=null;
function pinchState(){
  const [a,b]=[...ptrs.values()];
  return {d:Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, vb:Object.assign({},vb)};
}
svg.addEventListener('pointerdown',ev=>{
  if(ev.pointerType==='mouse' && ev.button!==0) return;
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
  if(ptrs.size===1){ drag={x:ev.clientX,y:ev.clientY,vb:Object.assign({},vb),moved:0,target:ev.target.closest('[data-id],[data-edge],[data-badge]')}; pinch=null; }
  else if(ptrs.size===2){ drag=null; pinch=pinchState(); }
});
svg.addEventListener('pointermove',ev=>{
  if(!ptrs.has(ev.pointerId)){ hover(ev); return; }
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  const r=canvas.getBoundingClientRect();
  if(ptrs.size===1 && drag){
    const dx=ev.clientX-drag.x, dy=ev.clientY-drag.y;
    drag.moved=Math.max(drag.moved,Math.hypot(dx,dy));
    if(drag.moved>5){ svg.classList.add('grabbing'); hideTip(); const k=drag.vb.w/r.width; setVB({x:drag.vb.x-dx*k, y:drag.vb.y-dy*k, w:drag.vb.w, h:drag.vb.h}); }
  } else if(ptrs.size===2 && pinch){
    const now=pinchState(), s=pinch.d/now.d, v=pinch.vb;
    const wx=v.x+((pinch.mx-r.left)/r.width)*v.w, wy=v.y+((pinch.my-r.top)/r.height)*v.h;
    const w=v.w*s, h=v.h*s;
    setVB({x:wx-((now.mx-r.left)/r.width)*w, y:wy-((now.my-r.top)/r.height)*h, w, h});
  }
});
function endPtr(ev,cancel){
  const d=drag;
  ptrs.delete(ev.pointerId);
  svg.classList.remove('grabbing');
  if(!cancel && d && d.moved<=5 && ptrs.size===0) activate(d.target);
  if(ptrs.size<2) pinch=null;
  if(ptrs.size===0) drag=null;
}
svg.addEventListener('pointerup',ev=>endPtr(ev,false));
svg.addEventListener('pointercancel',ev=>endPtr(ev,true));
svg.addEventListener('pointerleave',()=>hideTip());
svg.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter' && ev.key!==' ') return;
  const n=ev.target.closest && ev.target.closest('[data-id]');
  if(n){ ev.preventDefault(); selectNode(n.getAttribute('data-id')); }
});
let lastW=0;
const onResize=()=>{
  const W=canvas.clientWidth; if(!W) return;
  if(!lastW){ vb=norm(homeView()); applyView(); }
  else if(W!==lastW){ const k=W/lastW, cx=vb.x+vb.w/2, cy=vb.y+vb.h/2; setVB({x:cx-vb.w*k/2, y:cy-vb.h*k/2, w:vb.w*k, h:vb.h*k}); }
  else setVB(vb);
  lastW=W;
};
if(window.ResizeObserver) new ResizeObserver(onResize).observe(canvas); else window.addEventListener('resize',onResize);

/* ---------- tooltip ---------- */
const tip=$('#tip');
function hover(ev){
  if(ev.pointerType!=='mouse'){ return; }
  const g=ev.target.closest && ev.target.closest('[data-edge]');
  if(!g){ hideTip(); return; }
  const e=E[g.getAttribute('data-edge')];
  const r=canvas.getBoundingClientRect();
  tip.innerHTML='<b><span class="sw" style="--c:var(--w-'+e.layer+')"></span>'+esc(edgeLabel(e))+'</b>'+esc(nodeLabel(e.from))+' → '+esc(nodeLabel(e.to))+'<small>'+esc(t('layers')[e.layer])+' · '+esc(t('methods')[e.method]||e.method)+(e.decided?'':' · '+esc(t('undecided')))+'</small>';
  tip.hidden=false;
  let x=ev.clientX-r.left+14, y=ev.clientY-r.top+14;
  const tw=tip.offsetWidth, th=tip.offsetHeight;
  if(x+tw>r.width-8) x=ev.clientX-r.left-tw-14;
  if(y+th>r.height-8) y=ev.clientY-r.top-th-14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){ tip.hidden=true; }

/* ---------- state & focus ---------- */
function activate(target){
  if(!target){ if(state.tour) return; clearSel(); return; }
  if(target.hasAttribute('data-id')) selectNode(target.getAttribute('data-id'));
  else if(target.hasAttribute('data-badge')) selectNode(target.getAttribute('data-badge'));
  else if(target.hasAttribute('data-edge')) selectEdge(target.getAttribute('data-edge'));
}
function selectNode(id,opts){
  if(state.tour) endTour(true);
  state.sel=id; state.selEdge=null;
  applyFocus(); renderPanel();
  if(opts && opts.fit){
    const ids=[id]; EDGES.forEach(e => { if(e.from===id) ids.push(e.to); if(e.to===id) ids.push(e.from); });
    fitIds(ids);
  } else keepClear(N[id]);
}
const overlayPanel = () => window.matchMedia && matchMedia('(min-width:1061px)').matches;
function keepClear(n){
  if(!overlayPanel() || !n) return;
  const R=canvas.getBoundingClientRect(), free=R.width-372;
  const sx=(n.x+n.w/2-vb.x)/vb.w*R.width;
  if(sx>free-20) animateTo({x:vb.x+(sx-free/2)/R.width*vb.w, y:vb.y, w:vb.w, h:vb.h});
}
function selectEdge(id){
  if(state.tour) endTour(true);
  state.selEdge=id; state.sel=null;
  applyFocus(); renderPanel();
  const e=E[id]; if(e){ const a=N[e.from], b=N[e.to]; keepClear(a.x>b.x?a:b); }
}
function clearSel(){ state.sel=null; state.selEdge=null; applyFocus(); renderPanel(); }
function applyVisibility(){
  svg.querySelectorAll('.edge').forEach(g => {
    const e=E[g.getAttribute('data-edge')];
    g.classList.toggle('off', !state.layers.has(e.layer));
  });
  svg.classList.toggle('nojoints', !state.joints);
  svg.classList.toggle('hideplanned', !state.planned);
}
function focusSets(){
  const nodes=new Set(), edges=new Set(); let flow=false;
  if(state.tour){
    const tr=SK.tours.find(x=>x.id===state.tour), st=tr.steps[state.step];
    st.nodes.forEach(n=>nodes.add(n)); st.edges.forEach(e=>edges.add(e)); flow=true;
  } else if(state.sel){
    nodes.add(state.sel);
    EDGES.forEach(e => { if(e.from===state.sel||e.to===state.sel){ edges.add(e.id); nodes.add(e.from); nodes.add(e.to); } });
  } else if(state.selEdge){
    const e=E[state.selEdge]; edges.add(e.id); nodes.add(e.from); nodes.add(e.to);
  } else return null;
  return {nodes,edges,flow};
}
function applyFocus(){
  const fs=focusSets();
  svg.classList.toggle('focus', !!fs);
  gNodes.querySelectorAll('.node').forEach(g => {
    const id=g.getAttribute('data-id');
    g.classList.toggle('hl', !!fs && fs.nodes.has(id));
    g.classList.toggle('sel', state.sel===id);
  });
  gBadges.querySelectorAll('.sbadge').forEach(g => g.classList.toggle('hl', !!fs && fs.nodes.has(g.getAttribute('data-badge'))));
  svg.querySelectorAll('.edge').forEach(g => {
    const id=g.getAttribute('data-edge');
    const on=!!fs && fs.edges.has(id);
    g.classList.toggle('hl', on);
    g.classList.toggle('flowing', on && fs.flow);
  });
}

/* ---------- panel ---------- */

    h+='<div class="ep-h">'+esc(t('carries'))+'</div><p>'+esc(edgeCarries(e))+'</p>';
    h+='<div class="ep-h">'+esc(t('joinedBy'))+'</div><p>'+esc(t('methods')[e.method]||e.method)+'</p>';

ep.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.getAttribute('data-act')==='close') clearSel();

  else if(b.hasAttribute('data-node')) selectNode(b.getAttribute('data-node'));
  else if(b.hasAttribute('data-tour')) startTour(b.getAttribute('data-tour'));
});

/* ---------- tours ---------- */
const tourbar=$('#tourbar');
function startTour(id){
  state.tour=id; state.step=0; state.sel=null; state.selEdge=null;
  renderPanel(); showStep();
  const r=canvas.getBoundingClientRect();
  if(r.top<0 || r.bottom>innerHeight) $('#map').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
}
function endTour(silent){
  state.tour=null; tourbar.hidden=true;
  if(!silent){ applyFocus(); }
}
function showStep(){
  const tr=SK.tours.find(x=>x.id===state.tour); if(!tr) return;
  const n=tr.steps.length, i=state.step;
  let dots=''; for(let k=0;k<n;k++) dots+='<button type="button" data-step="'+k+'" class="'+(k===i?'on':(k<i?'done':''))+'" aria-label="'+esc(t('step'))+' '+(k+1)+'"></button>';
  tourbar.innerHTML='<div class="tb-h"><span class="tb-k">'+esc(t('walkthrough'))+(tr.status==='planned'?' · '+esc(t('plannedTag')):'')+'</span><button type="button" class="tb-x" data-act="close" aria-label="Close">×</button></div>'+
    '<div class="tb-t">'+esc(tourTitle(tr))+'</div><p class="tb-s">'+esc(stepText(tr,i))+'</p>'+
    '<div class="tb-f"><div class="tb-dots">'+dots+'</div><div class="tb-nav"><span>'+(i+1)+' / '+n+'</span><button type="button" data-act="prev" '+(i===0?'disabled':'')+'>'+esc(t('prev'))+'</button><button type="button" class="pri" data-act="next">'+esc(i===n-1?t('done'):t('next'))+'</button></div></div>';
  tourbar.hidden=false;
  applyFocus();
  const ids=tr.steps[i].nodes.slice();
  fitIds(ids, 90);
}
tourbar.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  const tr=SK.tours.find(x=>x.id===state.tour); if(!tr) return;
  if(b.hasAttribute('data-step')){ state.step=+b.getAttribute('data-step'); showStep(); return; }
  const a=b.getAttribute('data-act');
  if(a==='close') endTour(false);
  else if(a==='prev' && state.step>0){ state.step--; showStep(); }
  else if(a==='next'){ if(state.step<tr.steps.length-1){ state.step++; showStep(); } else { endTour(false); animateTo(homeView()); } }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ if(state.tour) endTour(false); else if(state.sel||state.selEdge) clearSel(); }
  if(!state.tour) return;
  const tr=SK.tours.find(x=>x.id===state.tour);
  if(ev.key==='ArrowRight' && state.step<tr.steps.length-1){ state.step++; showStep(); }
  if(ev.key==='ArrowLeft' && state.step>0){ state.step--; showStep(); }
});
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-tour]');
  if(b && !ep.contains(b)){ ev.preventDefault(); startTour(b.getAttribute('data-tour')); }
});

/* ---------- toolbar ---------- */
function renderTools(){
  const pr=$('#presets'); pr.innerHTML='';
  Object.keys(PRESETS).forEach(k => {
    const b=document.createElement('button'); b.type='button'; b.textContent=t(k);
    const set=PRESETS[k];
    b.setAttribute('aria-pressed', String(set.length===state.layers.size && set.every(l=>state.layers.has(l))));
    b.onclick=()=>{ state.layers=new Set(set); state.capLayer=null; renderTools(); applyVisibility(); if(state.sel) renderPanel(); };
    pr.appendChild(b);
  });
  const ch=$('#chips'); ch.innerHTML='';
  const count={}; EDGES.forEach(e=>count[e.layer]=(count[e.layer]||0)+1);
  LAYERS.forEach(l => {
    const b=document.createElement('button'); b.type='button'; b.className='chip';
    b.setAttribute('aria-pressed', String(state.layers.has(l)));
    b.style.setProperty('--c','var(--w-'+l+')');
    b.innerHTML='<i></i><span>'+esc(t('layers')[l])+'</span><small>'+(count[l]||0)+'</small>';
    b.title=layerHint(l);
    b.onclick=()=>{ if(state.layers.has(l)) state.layers.delete(l); else state.layers.add(l); state.capLayer=l; renderTools(); applyVisibility(); if(state.sel) renderPanel(); };
    b.onmouseenter=()=>{ state.capLayer=l; renderCaption(); };
    b.onfocus=()=>{ state.capLayer=l; renderCaption(); };
    ch.appendChild(b);
  });
  $('#tgJoints').checked=state.joints; $('#tgPlanned').checked=state.planned;
  renderCaption();
}
function renderCaption(){
  const c=$('#caption'), l=state.capLayer;
  c.innerHTML = l ? '<b>'+esc(t('layers')[l])+'</b> · '+esc(layerHint(l)) : esc(t('captionIdle'));
}
$('#chips').addEventListener('mouseleave',()=>{ state.capLayer=null; renderCaption(); });
$('#tgJoints').onchange=ev=>{ state.joints=ev.target.checked; applyVisibility(); };
$('#tgPlanned').onchange=ev=>{ state.planned=ev.target.checked; applyVisibility(); };

/* ---------- legend & lower sections ---------- */
function renderLegend(){
  const w=(cls,style)=>'<svg class="w" viewBox="0 0 26 10" aria-hidden="true"><path d="M2 5h22" fill="none" stroke-width="2.4" stroke-linecap="round" style="'+style+'"/></svg>';
  const m=h=>'<svg viewBox="-6 -6 12 12" aria-hidden="true">'+h+'</svg>';
  $('#legend').innerHTML=STATUS_ORDER.map(st=>'<span class="lg">'+stIcon(st)+esc(t('st')[st])+'</span>').join('')+'<span class="lg-sep"></span>'+
    '<span class="lg">'+w('','stroke:var(--ink-2)')+esc(t('lgDecided'))+'</span>'+
    '<span class="lg">'+w('','stroke:var(--ink-2);stroke-dasharray:6 4')+esc(t('lgUndecided'))+'</span>'+
    '<span class="lg">'+w('','stroke:var(--w-software);stroke-dasharray:1.5 4')+esc(t('lgNet'))+'</span>'+
    '<span class="lg">'+w('','stroke:var(--w-wifi);stroke-dasharray:7 5')+esc(t('lgRadio'))+'</span>'+
    '<span class="lg">'+m('<circle r="3.6" class="jm-solder"/>')+esc(t('lgSolder'))+'</span>'+
    '<span class="lg">'+m('<circle r="4.2" class="jm-screw"/><path d="M-2.6 2.6 2.6-2.6" class="jm-screw-s"/>')+esc(t('lgScrew'))+'</span>'+
    '<span class="lg">'+m('<rect x="-3.4" y="-3.4" width="6.8" height="6.8" rx="1" style="fill:var(--ink-2)"/>')+esc(t('lgPlug'))+'</span>'+
    '<span class="lg">'+m('<rect x="-4.5" y="-3" width="9" height="6" rx="1.2" class="jm-wago"/>')+esc(t('lgWago'))+'</span>'+
    '<span class="lg">'+m('<circle r="3.6" style="fill:var(--w-v5)"/>')+esc(t('lgBar'))+'</span>'+
    '<span class="hint">'+esc(coarse?t('hintTouch'):t('hintMouse'))+'</span>';
}
function renderLower(){
  $('#tours').innerHTML=SK.tours.map((tr,i)=>'<li class="'+(tr.status==='planned'?'planned':'')+'"><button type="button" data-tour="'+tr.id+'"><span class="tn">'+String(i+1).padStart(2,'0')+'</span><span class="tt">'+esc(tourTitle(tr))+'</span><span class="ts">'+tr.steps.length+' '+esc(t('steps'))+'</span></button></li>').join('');
  $('#solder').innerHTML=SK.solder.map((s,i)=>{ const x=solderTx(s.node)||{}; return '<li><span class="badge">'+(i+1)+'</span><h4><button type="button" data-show="'+s.node+'">'+esc(nodeLabel(s.node))+'</button></h4><p>'+esc(x.what||s.hint)+'</p>'+(x.caution?'<p class="cau"><b>'+esc(t('careful'))+'</b>'+esc(x.caution)+'</p>':'')+'</li>'; }).join('');
  $('#solderCount').textContent=SK.solder.length;
  const nodes=Object.values(N).filter(n=>n.kind!=='rail' || true);
  const counts={}; nodes.forEach(n=>counts[n.status]=(counts[n.status]||0)+1);
  $('#counts').innerHTML=STATUS_ORDER.filter(s=>counts[s]).map(s=>'<span class="stb">'+stIcon(s)+'<b>'+counts[s]+'</b> '+esc(t('st')[s])+'</span>').join('');
  $('#partsCount').textContent=nodes.length;
  const sorted=nodes.slice().sort((a,b)=>(ZONE_ORDER.indexOf(a.zone)-ZONE_ORDER.indexOf(b.zone))||(STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status)));
  $('#parts').innerHTML=sorted.map(n=>'<tr data-node="'+n.id+'"><td><b>'+esc(nodeLabel(n.id))+'</b></td><td class="mono">'+esc(n.tag)+'</td><td>'+stBadge(n.status)+'</td><td>'+esc(zoneName(n.zone))+'</td></tr>').join('');
  const pend = (TX.pending && TX.pending.length) ? TX.pending.map(p => p[lang] || p.en) : (lang==='de' && UI.de.pending ? UI.de.pending : SK.pending);
  $('#open').innerHTML=pend.map(p=>'<li>'+esc(p)+'</li>').join('');
  $('#openCount').textContent=pend.length;
  const pl=$('#plate'); pl.innerHTML=t('plate').map(r=>'<dt>'+esc(r[0])+'</dt><dd class="'+(r[0]==='Camera'||r[0]==='Kamera'?'none':'')+'">'+esc(r[1])+'</dd>').join('');
  const d=new Date((DATA.state||'2026-09-24')+'T12:00:00');
  $('#state').textContent=t('stateOf')+' '+(lang==='de'?d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}));
}
function showOnMap(id){ selectNode(id,{fit:true}); $('#map').scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'}); }
$('#parts').addEventListener('click',ev=>{ const tr=ev.target.closest('tr[data-node]'); if(tr) showOnMap(tr.getAttribute('data-node')); });
$('#solder').addEventListener('click',ev=>{ const b=ev.target.closest('[data-show]'); if(b) showOnMap(b.getAttribute('data-show')); });


/* ---------- roadmap ---------- */
const MS = SK.milestones || [];
const TRACK_COLOR = {plan:'var(--ink-2)',hw:'var(--w-ethernet)',sw:'var(--w-poe)',wx:'var(--w-wifi)',box:'var(--brass-2)'};
function msTx(id){ const x=(TX.milestones||{})[id]; return (x && (x[lang]||x.en)) || {title:id,why:'',done_when:'',tasks:{}}; }
function msNo(id){ return 'M'+MS.findIndex(m=>m.id===id); }
function msProg(m){ return [m.tasks.filter(k=>k.status==='done').length, m.tasks.length]; }
function taskIcon(st){
  if(st==='done') return '<svg viewBox="0 0 16 16" class="ti ti-done" aria-hidden="true"><circle cx="8" cy="8" r="7"/><path d="M4.6 8.3 7 10.6l4.4-5"/></svg>';
  if(st==='doing') return '<svg viewBox="0 0 16 16" class="ti ti-doing" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z"/></svg>';
  if(st==='waiting') return '<svg viewBox="0 0 16 16" class="ti ti-waiting" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/></svg>';
  if(st==='decide') return '<svg viewBox="0 0 16 16" class="ti ti-decide" aria-hidden="true"><rect x="3.4" y="3.4" width="9.2" height="9.2" rx="1" transform="rotate(45 8 8)"/></svg>';
  return '<svg viewBox="0 0 16 16" class="ti ti-open" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/></svg>';
}
function roundPath(P,R){
  R=R||8; let d='M'+P[0][0]+' '+P[0][1], cur=P[0];
  for(let i=1;i<P.length;i++){
    const b=P[i], c=P[i+1];
    if(c){
      const l1=Math.hypot(b[0]-cur[0],b[1]-cur[1]), l2=Math.hypot(c[0]-b[0],c[1]-b[1]), r=Math.min(R,l1/2,l2/2);
      const e=[b[0]-(b[0]-cur[0])/l1*r, b[1]-(b[1]-cur[1])/l1*r], o=[b[0]+(c[0]-b[0])/l2*r, b[1]+(c[1]-b[1])/l2*r];
      d+=' L'+f(e[0])+' '+f(e[1])+' Q'+b[0]+' '+b[1]+' '+f(o[0])+' '+f(o[1]); cur=o;
    } else { d+=' L'+b[0]+' '+b[1]; cur=b; }
  }
  return d;
}
function shortLock(text){
  let s=text, pre=t('lockPrefix');
  if(s.indexOf(pre)===0) s=s.slice(pre.length);
  s=s.replace(/ *\([^)]*\)/g,'').replace(/, after .*$/,'').trim();
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function renderRoadmap(){
  const rs=$('#rmsvg'); if(!rs || !MS.length || !LY.roadmap) return;
  const R=LY.roadmap; rs.setAttribute('viewBox', R.viewBox.join(' '));
  rs.setAttribute('aria-label', t('roadmapTitle'));
  rs.innerHTML='';
  el('defs',null,rs,'<marker id="rmArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" style="fill:var(--muted)"/></marker>');
  const gL=el('g',{class:'rm-links'},rs);
  R.links.forEach(l=>{
    const g=el('g',{class:'rm-link'+(l.soft?' soft':''),'data-from':l.from,'data-to':l.to},gL);
    el('path',{d:roundPath(l.pts),class:'rm-wire','marker-end':'url(#rmArrow)'},g);
    if(l.soft){ const a=l.pts[0], b=l.pts[1]; txt(g,{x:f((a[0]+b[0])/2),y:a[1]-7,'text-anchor':'middle',class:'rm-soft-l'},t('rmProvides')); }
  });
  const gC=el('g',{class:'rm-cards'},rs);
  MS.forEach((m,i)=>{
    const c=R.cards[m.id]; if(!c) return;
    const [x,y,w,h]=c, tx=msTx(m.id), pr=msProg(m), dec=m.tasks.filter(k=>k.status==='decide').length;
    const g=el('g',{class:'rm-card st-'+m.status+(m.track==='wx'?' explore':''),'data-ms':m.id,tabindex:0,role:'button','aria-label':'M'+i+' '+tx.title+', '+t('msSt')[m.status]},gC);
    el('rect',{x,y,width:w,height:h,rx:10,class:'rm-bg'},g);
    el('rect',{x:x+.6,y:y+12,width:4,height:h-24,rx:2,style:'fill:'+TRACK_COLOR[m.track]},g);
    const pl=t('msSt')[m.status].toUpperCase(); mctx.font='600 9.5px "JetBrains Mono", Consolas, monospace';
    const pw=mctx.measureText(pl).width+14;
    // header "M1 · TRACK": drop the track name when it would run under the status pill
    mctx.font='500 10px "JetBrains Mono", Consolas, monospace';
    const kw=s=>mctx.measureText(s.toUpperCase()).width+s.length*0.6, kroom=w-16-pw-22;
    let kline='M'+i+' · '+t('tracks')[m.track]; if(m.track==='wx') kline+=' · '+t('exploratory');
    if(kw(kline)>kroom) kline='M'+i+(m.track==='wx' && kw('M'+i+' · '+t('exploratory'))<=kroom ? ' · '+t('exploratory') : '');
    txt(g,{x:x+16,y:y+23,class:'rm-k'},kline);
    const pg=el('g',{class:'rm-pill p-'+m.status},g);
    el('rect',{x:f(x+w-12-pw),y:y+10,width:f(pw),height:18,rx:9},pg);
    txt(pg,{x:f(x+w-12-pw/2),y:y+22.5,'text-anchor':'middle'},pl);
    const lines=wrap(tx.title,'600 16px Barlow, "Segoe UI", system-ui, sans-serif',w-34,2);
    lines.forEach((ln,k)=>txt(g,{x:x+16,y:y+48+k*19,class:'rm-t'},ln));
    const bw=w-16-16-(dec?78:48), by=y+h-21;
    el('rect',{x:x+16,y:by,width:bw,height:6,rx:3,class:'rm-barbg'},g);
    if(pr[0]) el('rect',{x:x+16,y:by,width:f(bw*pr[0]/pr[1]),height:6,rx:3,class:'rm-bar'},g);
    txt(g,{x:x+w-16,y:by+6.5,'text-anchor':'end',class:'rm-n'},pr[0]+'/'+pr[1]);
    if(dec){ const dx=x+w-62, dy=by+3; el('rect',{x:dx-4,y:dy-4,width:8,height:8,rx:1,class:'rm-dia',transform:'rotate(45 '+dx+' '+dy+')'},g); txt(g,{x:dx+8,y:by+6.5,class:'rm-n'},String(dec)); }
  });
  const lgPill=(s)=>'<span class="pill p-'+s+'">'+esc(t('msSt')[s])+'</span>';
  const line=(style)=>'<svg viewBox="0 0 26 12" aria-hidden="true"><path d="M1 6h20" fill="none" stroke-width="1.8" style="stroke:var(--muted);'+style+'"/><path d="M19 2.5 25 6l-6 3.5z" style="fill:var(--muted)"/></svg>';
  $('#rmLegend').innerHTML=['now','next','later','done'].map(lgPill).join(' ')+
    '<span class="lg">'+line('')+esc(t('lgNeeds'))+'</span>'+
    '<span class="lg">'+line('stroke-dasharray:4 4')+esc(t('lgProvides'))+'</span>'+
    '<span class="lg"><svg viewBox="0 0 26 12" aria-hidden="true"><rect x="1" y="1" width="24" height="10" rx="3" fill="none" stroke-width="1.4" style="stroke:var(--ink-2);stroke-dasharray:4 3"/></svg>'+esc(t('lgExplore'))+'</span>'+
    '<span class="lg"><span class="dia"></span>'+esc(t('lgDecision'))+'</span>'+
    Object.keys(TRACK_COLOR).map(k=>'<span class="lg"><i class="trk" style="background:'+TRACK_COLOR[k]+'"></i>'+esc(t('tracks')[k])+'</span>').join('');
  const locks=[]; MS.forEach(m=>m.tasks.forEach(k=>{ if(k.status==='decide') locks.push([m,k]); }));
  $('#lockins').innerHTML='<div class="lk-h">'+esc(t('lockins'))+'<small>'+locks.length+'</small></div><ul class="lk">'+
    locks.map(([m,k])=>'<li><button type="button" data-ms-open="'+m.id+'"><span class="dia"></span><span>'+esc(shortLock(msTx(m.id).tasks[k.id]||k.id))+'</span><span class="lk-m">'+msNo(m.id)+'</span></button></li>').join('')+'</ul>';
  $('#rmList').innerHTML=MS.map((m,i)=>{
    const tx=msTx(m.id), pr=msProg(m);
    let h='<details class="ms" id="ms-'+m.id+'"><summary><span class="ms-n">M'+i+'</span><span class="ms-t">'+esc(tx.title)+'<small>'+esc(t('tracks')[m.track])+(m.track==='wx'?' · '+esc(t('exploratory')):'')+'</small></span>'+
      '<span class="pill p-'+m.status+'">'+esc(t('msSt')[m.status])+'</span><span class="ms-p"><i style="--p:'+Math.round(100*pr[0]/pr[1])+'%"></i>'+pr[0]+'/'+pr[1]+'</span></summary><div class="ms-b">';
    h+='<p class="ms-why">'+esc(tx.why)+'</p>';
    const needs=m.needs.concat(m.soft||[]);
    if(needs.length) h+='<div class="ms-needs"><span>'+esc(t('needs'))+':</span>'+needs.map(n=>'<button type="button" data-ms-open="'+n+'">'+msNo(n)+' · '+esc(msTx(n).title)+'</button>').join('')+'</div>';
    h+='<ol class="tasks">'+m.tasks.map(k=>'<li class="tk st-'+k.status+'">'+taskIcon(k.status)+'<span class="tk-t">'+esc(tx.tasks[k.id]||k.id)+(k.node&&N[k.node]?'<button type="button" data-show="'+k.node+'">'+esc(t('onMap'))+' ↗</button>':'')+'</span><span class="tk-s">'+esc(t('tkSt')[k.status])+'</span></li>').join('')+'</ol>';
    h+='<div class="ms-exit"><b>'+esc(t('doneWhen'))+'</b>'+esc(tx.done_when)+'</div></div></details>';
    return h;
  }).join('');
}
function openMs(id){
  const d=document.getElementById('ms-'+id); if(!d) return;
  d.open=true;
  document.querySelectorAll('#rmsvg .rm-card').forEach(g=>g.classList.toggle('sel', g.getAttribute('data-ms')===id));
  d.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
  d.classList.add('flash'); setTimeout(()=>d.classList.remove('flash'),1200);
}
function rmFocus(id){
  const rs=$('#rmsvg'); rs.classList.toggle('rm-focus', !!id);
  rs.querySelectorAll('.rm-link').forEach(l=>l.classList.toggle('hl', !!id && (l.getAttribute('data-from')===id || l.getAttribute('data-to')===id)));
  rs.querySelectorAll('.rm-card').forEach(c=>{ const m=c.getAttribute('data-ms'); c.classList.toggle('hl', !!id && (m===id || [...rs.querySelectorAll('.rm-link.hl')].some(l=>l.getAttribute('data-from')===m || l.getAttribute('data-to')===m))); });
}
$('#rmsvg').addEventListener('click',ev=>{ const c=ev.target.closest('[data-ms]'); if(c) openMs(c.getAttribute('data-ms')); });
$('#rmsvg').addEventListener('keydown',ev=>{ if(ev.key!=='Enter' && ev.key!==' ') return; const c=ev.target.closest && ev.target.closest('[data-ms]'); if(c){ ev.preventDefault(); openMs(c.getAttribute('data-ms')); } });
$('#rmsvg').addEventListener('pointerover',ev=>{ const c=ev.target.closest('[data-ms]'); rmFocus(c?c.getAttribute('data-ms'):null); });
$('#rmsvg').addEventListener('pointerleave',()=>rmFocus(null));
$('#roadmap').addEventListener('click',ev=>{
  const o=ev.target.closest('[data-ms-open]'); if(o){ ev.preventDefault(); openMs(o.getAttribute('data-ms-open')); return; }
  const sh=ev.target.closest('[data-show]'); if(sh){ ev.preventDefault(); showOnMap(sh.getAttribute('data-show')); }
});

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(n=>{ const v=t(n.getAttribute('data-t')); if(typeof v==='string') n.textContent=v; });
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed', String(b.getAttribute('data-lang')===lang)));
  svg.setAttribute('aria-label', lang==='de'?'Schaltplan der Klingelbox':'Wiring map of the Klingelbox');
  renderTools(); renderLegend(); renderLower(); renderRoadmap(); renderSVG(); renderPanel();
  if(state.tour) showStep();
}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.getAttribute('data-lang'); store.set('kb-lang',lang); applyLang(); });

vb=norm(homeView());
applyLang();
requestAnimationFrame(()=>{ if(canvas.clientWidth){ lastW=canvas.clientWidth; vb=norm(homeView()); applyView(); } });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ renderSVG(); renderRoadmap(); });
})();
</script>
